<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
    <meta name="theme-color" content="#080c18">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="The Journal">
    <meta name="description" content="A free platform for independent physics researchers. No degree required.">
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/static/icon-192.png">
    <title>The Journal — Independent Physics</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #080c18; color: #edf1ff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; -webkit-font-smoothing: antialiased; }
        #root { min-height: 100vh; min-height: 100dvh; }
        /* Splash screen while React loads */
        #splash { position: fixed; inset: 0; background: #080c18; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 9999; transition: opacity 0.3s; }
        #splash.hide { opacity: 0; pointer-events: none; }
        #splash .diamond { width: 48px; height: 48px; background: linear-gradient(135deg, #5ea8ff, #3d70b8); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 800; color: #fff; margin-bottom: 16px; animation: pulse 2s ease-in-out infinite; }
        #splash h1 { font-size: 20px; font-weight: 800; letter-spacing: -0.02em; }
        #splash p { font-size: 13px; color: #5a6a94; margin-top: 4px; }
        @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.08); } }
    </style>
</head>
<body>
    <div id="splash">
        <div class="diamond">⧫</div>
        <h1>The Journal</h1>
        <p>Independent Physics</p>
    </div>
    <div id="root"></div>

    <!-- React via CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- App -->
    <script type="text/babel" data-type="module">
    // Hide splash after load
    window.addEventListener('load', () => {
        setTimeout(() => document.getElementById('splash')?.classList.add('hide'), 800);
    });

    // Register service worker
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js').catch(() => {});
    }

    const { useState, useEffect, useRef, useCallback } = React;

    // ── The full app code goes here ──
    // In production, this would be a bundled React build.
    // For now, we inline the journal-app component.

    const root = ReactDOM.createRoot(document.getElementById('root'));

    function App() {
        return React.createElement('div', {
            style: { minHeight: '100vh', background: 'linear-gradient(180deg, #080c18, #0d1225 30%, #0a0f1e)', color: '#edf1ff', fontFamily: "'DM Sans','Helvetica Neue',sans-serif", padding: '60px 20px', textAlign: 'center' }
        },
            React.createElement('div', { style: { width: 48, height: 48, borderRadius: 12, background: 'linear-gradient(135deg, #5ea8ff, #3d70b8)', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 24, fontWeight: 800, margin: '0 auto 16px' } }, '⧫'),
            React.createElement('h1', { style: { fontSize: 24, fontWeight: 800, marginBottom: 8 } }, 'The Journal'),
            React.createElement('p', { style: { fontSize: 15, color: '#8a9ac4', marginBottom: 24, maxWidth: 400, margin: '0 auto 24px' } }, 'Independent Physics Platform — The PBS of Science Apps'),
            React.createElement('p', { style: { fontSize: 13, color: '#5a6a94', maxWidth: 500, margin: '0 auto 32px', lineHeight: 1.6 } },
                'Server is running. To see the full app, build the React front-end and place the bundle in this directory. The API is live at /api/'),
            React.createElement('div', { style: { display: 'flex', flexDirection: 'column', gap: 8, maxWidth: 300, margin: '0 auto' } },
                ['GET /api/stats', 'GET /api/categories', 'GET /api/feed/discovery', 'GET /api/feed/published', 'POST /api/auth/register', 'POST /api/submissions'].map(ep =>
                    React.createElement('code', { key: ep, style: { padding: '8px 12px', borderRadius: 8, background: 'rgba(255,255,255,0.03)', border: '1px solid rgba(255,255,255,0.06)', fontSize: 12, color: '#5ea8ff', textAlign: 'left' } }, ep)
                )
            )
        );
    }

    root.render(React.createElement(App));
    </script>
</body>
</html>
