const {useState,useEffect,useRef,useCallback,Component} = React;

// Error Boundary Component
class ErrorBoundary extends Component {
  constructor(props) {
    super(props);
    this.state = { hasError: false, error: null };
  }
  static getDerivedStateFromError(error) {
    return { hasError: true, error };
  }
  componentDidCatch(error, errorInfo) {
    console.error("Caught error:", error, errorInfo);
  }
  render() {
    if (this.state.hasError) {
      return (
        <div className="error-boundary">
          <strong>Error:</strong> {this.state.error && this.state.error.toString()}
          <br />
          <button onClick={() => this.setState({ hasError: false, error: null })} style={{marginTop:8,background:"white",color:"#ef4444",border:"none",padding:"4px 8px",borderRadius:6,fontSize:10,cursor:"pointer"}}>Dismiss</button>
        </div>
      );
    }
    return this.props.children;
  }
}

const tAgo=(d)=>{if(!d)return"";const m=Math.floor((Date.now()-new Date(d))/6e4);return m<60?m+"m":m<1440?Math.floor(m/60)+"h":Math.floor(m/1440)+"d";};

const API={get(url){return new Promise(function(r){const x=new XMLHttpRequest();x.open("GET",url,true);x.withCredentials=true;x.onload=function(){try{r(JSON.parse(x.responseText));}catch(e){r({});}};x.onerror=function(){r({});};x.send();});},post(url,body){return new Promise(function(r){const x=new XMLHttpRequest();x.open("POST",url,true);x.withCredentials=true;x.setRequestHeader("Content-Type","application/json");x.onload=function(){try{r(JSON.parse(x.responseText));}catch(e){r({});}};x.onerror=function(){r({});};x.send(JSON.stringify(body||{}));});},put(url,body){return new Promise(function(r){const x=new XMLHttpRequest();x.open("PUT",url,true);x.withCredentials=true;x.setRequestHeader("Content-Type","application/json");x.onload=function(){try{r(JSON.parse(x.responseText));}catch(e){r({});}};x.onerror=function(){r({});};x.send(JSON.stringify(body||{}));});},del(url){return new Promise(function(r){const x=new XMLHttpRequest();x.open("DELETE",url,true);x.withCredentials=true;x.onload=function(){try{r(JSON.parse(x.responseText));}catch(e){r({});}};x.onerror=function(){r({});};x.send();});},postForm(url,fd){return new Promise(function(r){const x=new XMLHttpRequest();x.open("POST",url,true);x.withCredentials=true;x.onload=function(){try{r(JSON.parse(x.responseText));}catch(e){r({error:"Parse error"});}};x.onerror=function(){r({error:"Network error"});};x.send(fd);});}};
function HIcon({d,s=17,f}){return <svg width={s} height={s} viewBox="0 0 24 24" fill={f?"currentColor":"none"} stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d={d}/></svg>;}

function DualSpark({a,b,height=90}){if(!a||!a.length)return null;const width=320;const joined=(a||[]).concat(b||[]);const min=Math.min.apply(null,joined);const max=Math.max.apply(null,joined);const range=(max-min)||1;const mk=function(data){return data.map(function(v,i){const x=(i/Math.max(1,data.length-1))*width;const y=height-6-((v-min)/range)*(height-12);return x+','+y;}).join(' ');};return<svg width="100%" viewBox={'0 0 '+width+' '+height} style={{display:'block'}}><polyline points={mk(a)} fill="none" stroke="#5ea8ff" strokeWidth="2" strokeLinejoin="round" strokeLinecap="round"/><polyline points={mk(b||[])} fill="none" stroke="#a78bfa" strokeWidth="1.5" strokeLinejoin="round" strokeLinecap="round" opacity="0.9"/></svg>;}

function ToolResultView({result,onExport}){

    {isCLM&&<div><div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:12}}><MetricCard label="Kappa-W" value={d.kappa_w.toFixed(4)} color="#c084fc"/><MetricCard label="Glue Error" value={d.glue_error.toFixed(4)} color="#5ea8ff"/><MetricCard label="Stability" value={d.stability.toFixed(4)} color={d.stability>=0.5?"#4ade80":"#f0a030"}/></div><div style={{display:"flex",gap:8,flexWrap:"wrap"}}><MetricCard label="P-RMS" value={d.prms.toFixed(4)} color="#6b7db3"/><MetricCard label="Recov. Integral" value={d.ri.toFixed(4)} color="#a78bfa"/></div></div>}

    {!isOCM&&!isER&&!isICM&&!isCLM&&!isDesk&&d&&Object.keys(d).length>0&&<pre style={{whiteSpace:"pre-wrap",wordBreak:"break-word",fontSize:12,lineHeight:1.5,color:"#8a9ac4"}}>{typeof d==="string"?d:JSON.stringify(d,null,2)}</pre>}

  </div>;
}
function AuthScreen({onAuth}){
  const[mode,sM]=useState("login");const[email,sE]=useState("");const[name,sN]=useState("");const[pw,sP]=useState("");const[err,sErr]=useState("");const[loading,sL]=useState(false);

arget.value)} placeholder="Password" type="password" onKeyDown={(e)=>{if(e.key==="Enter")submit();}} style={{width:"100%",padding:"11px 14px",borderRadius:10,border:"1px solid rgba(255,255,255,0.08)",background:"rgba(255,255,255,0.03)",color:"#edf1ff",fontSize:14,boxSizing:"border-box"}}/>{err&&<div style={{fontSize:12,color:"#ef4444",padding:"6px 10px",borderRadius:8,background:"rgba(239,68,68,0.08)"}}>{err}</div>}<button onClick={submit} disabled={loading||!email||!pw||(mode==="register"&&!name)} style={{padding:"12px",borderRadius:10,border:"none",fontSize:14,fontWeight:700,cursor:"pointer",background:"linear-gradient(135deg,#5ea8ff,#3d8be0)",color:"#071120"}}>{loading?"...":(mode==="login"?"Sign In":"Create Account")}</button></div><button onClick={()=>onAuth(_usr,false)} style={{display:"block",width:"100%",marginTop:12,padding:"10px",borderRadius:10,border:"1px solid rgba(255,255,255,0.06)",background:"transparent",color:"#4a5a7e",fontSize:12,fontWeight:600,cursor:"pointer"}}>Continue as guest</button><p style={{fontSize:11,color:"#3a4a6e",textAlign:"center",marginTop:16,lineHeight:1.5}}>No degree required. No institution needed. Just curiosity.</p></div></div>;

function PaperCard({paper,onOpen,onProfile,onLike}){
