    #splash{position:fixed;inset:0;background:#080c18;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;transition:opacity .4s}

    @keyframes slideInLeft{from{opacity:0;transform:translateX(-30px)}to{opacity:1;transform:translateX(0)}}

    ::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.08);border-radius:3px}
    .error-boundary{position:fixed;bottom:20px;left:10px;right:10px;background:#ef4444;color:white;padding:12px;border-radius:12px;font-size:12px;z-index:10000;word-break:break-word;max-height:40%;overflow:auto}
    button:disabled{cursor:not-allowed;opacity:0.6}
    button:active:not(:disabled){transform:scale(0.97);transition:transform 0.1s}

  <div id="splash"><div class="d">OF</div><h1>OpenField</h1><p>Independent Science</p><div class="loading">Loading...</div></div>

  <script type="text/babel">
const {useState,useEffect,useRef,useCallback,useMemo,Component} = React;

class ErrorBoundary extends Component {
  constructor(props) {
    super(props);
    this.state = { hasError: false, error: null };
  }
  static getDerivedStateFromError(error) {
    return { hasError: true, error };
  }
  componentDidCatch(error, errorInfo) {
    console.error("Caught error:", error, errorInfo);
  }
  render() {
    if (this.state.hasError) {
      return (
        <div className="error-boundary">
          <strong>Error:</strong> {this.state.error && this.state.error.toString()}
          <br />
          <button onClick={() => this.setState({ hasError: false, error: null })} style={{marginTop:8,background:"white",color:"#ef4444",border:"none",padding:"4px 8px",borderRadius:6,fontSize:10,cursor:"pointer"}}>Dismiss</button>
        </div>
      );
    }
    return this.props.children;
  }
}

const CATS=[{id:1,slug:"foundations",name:"Foundations of Physics",emoji:"\u{1F30C}"},{id:2,slug:"math-physics",name:"Mathematical Physics",emoji:"\u{1F4D0}"},{id:3,slug:"nonlinear",name:"Nonlinear Dynamics",emoji:"\u{1F300}"},{id:4,slug:"stat-mech",name:"Statistical Mechanics",emoji:"\u269B\uFE0F"},{id:5,slug:"complex",name:"Complex Systems",emoji:"\u{1F578}\uFE0F"},{id:6,slug:"experimental",name:"Experimental & Observational",emoji:"\u{1F52C}"},{id:7,slug:"natural",name:"Natural & Environmental Sciences",emoji:"\u{1F33F}"}];
let _usr={id:1,email:"guest",display_name:"Guest",initials:"GU",bio:"",reputation_score:0,paper_count:0,review_count:0,follower_count:0,avatar_color:"#5ea8ff",avatar_filename:"",joined:null,role:"guest"};
const tAgo=(d)=>{if(!d)return"";const m=Math.floor((Date.now()-new Date(d))/6e4);return m<60?m+"m":m<1440?Math.floor(m/60)+"h":Math.floor(m/1440)+"d";};
const fDate=(d)=>{if(!d)return"";return new Date(d).toLocaleDateString("en-US",{year:"numeric",month:"short",day:"numeric"});};
function normalizeOrcid(orcid){if(!orcid)return'';const clean=String(orcid).trim().replace(/https?:\/\/orcid\.org\//i,'').replace(/[^0-9Xx-]/g,'');return clean;}
function orcidUrl(orcid){const n=normalizeOrcid(orcid);return n?'https://orcid.org/'+n:'';}
function copyText(text){if(navigator.clipboard&&navigator.clipboard.writeText){return navigator.clipboard.writeText(text);}const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);return Promise.resolve();}
function formatBibTeX(p){const author=(p.author&&p.author.display_name)||'Anonymous';const year=(p.published_at||p.created_at||'').slice(0,4)||new Date().getFullYear();const key=(author.split(' ')[0]||'openfield').toLowerCase()+year;return '@article{'+key+',\n  title = {'+(p.title||'Untitled')+'},\n  author = {'+author+'},\n  journal = {OpenField},\n  year = {'+year+'},'+(p.openfield_id?'\n  note = {'+p.openfield_id+'},':'')+'\n  url = {'+window.location.origin+'}\n}';}
function similarityScore(a,b){const words=function(x){return String(x||'').toLowerCase().replace(/[^a-z0-9\s]/g,' ').split(/\s+/).filter(Boolean);};const aw=new Set(words((a.title||'')+' '+(a.abstract||'')));const bw=words((b.title||'')+' '+(b.abstract||''));let hit=0;bw.forEach(function(w){if(aw.has(w))hit++;});return hit;}

const API={
  get(url){return new Promise(function(r){const x=new XMLHttpRequest();x.open("GET",url,true);x.withCredentials=true;x.onload=function(){try{r(JSON.parse(x.responseText));}catch(e){r({});}};x.onerror=function(){r({});};x.send();});},
  post(url,body){return new Promise(function(r){const x=new XMLHttpRequest();x.open("POST",url,true);x.withCredentials=true;x.setRequestHeader("Content-Type","application/json");x.onload=function(){try{r(JSON.parse(x.responseText));}catch(e){r({});}};x.onerror=function(){r({});};x.send(JSON.stringify(body||{}));});},
  put(url,body){return new Promise(function(r){const x=new XMLHttpRequest();x.open("PUT",url,true);x.withCredentials=true;x.setRequestHeader("Content-Type","application/json");x.onload=function(){try{r(JSON.parse(x.responseText));}catch(e){r({});}};x.onerror=function(){r({});};x.send(JSON.stringify(body||{}));});},
  del(url){return new Promise(function(r){const x=new XMLHttpRequest();x.open("DELETE",url,true);x.withCredentials=true;x.onload=function(){try{r(JSON.parse(x.responseText));}catch(e){r({});}};x.onerror=function(){r({});};x.send();});},
  postForm(url,fd){return new Promise(function(r){const x=new XMLHttpRequest();x.open("POST",url,true);x.withCredentials=true;x.onload=function(){try{r(JSON.parse(x.responseText));}catch(e){r({error:"Parse error"});}};x.onerror=function(){r({error:"Network error"});};x.send(fd);});},
  putForm(url,fd){return new Promise(function(r){const x=new XMLHttpRequest();x.open("PUT",url,true);x.withCredentials=true;x.onload=function(){try{r(JSON.parse(x.responseText));}catch(e){r({error:"Parse error"});}};x.onerror=function(){r({error:"Network error"});};x.send(fd);})}
};
function HIcon({d,s=17,f}){return <svg width={s} height={s} viewBox="0 0 24 24" fill={f?"currentColor":"none"} stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d={d}/></svg>;}
function Av({user,size=36}){const i=user&&user.initials?user.initials:((user&&user.display_name?user.display_name:"??").split(" ").map(x=>x[0]).join("").toUpperCase().slice(0,2)||"??");const c=user&&user.avatar_color?user.avatar_color:"#5ea8ff";const avatarFile=user&&user.avatar_filename?`/static/avatars/${user.avatar_filename}`:null;if(avatarFile){return<img src={avatarFile} style={{width:size,height:size,borderRadius:"50%",objectFit:"cover",flexShrink:0}} alt="avatar"/>}return<div style={{width:size,height:size,borderRadius:"50%",background:"linear-gradient(135deg,"+c+","+c+"88)",display:"flex",alignItems:"center",justifyContent:"center",color:"#fff",fontWeight:700,fontSize:size*.36,flexShrink:0}}>{i}</div>;}
function Badge({label,color}){return<span style={{display:"inline-flex",alignItems:"center",gap:4,padding:"2px 8px",borderRadius:12,fontSize:10,fontWeight:700,background:(color||"#6b7db3")+"15",color:color||"#6b7db3",border:"1px solid "+(color||"#6b7db3")+"30"}}><span style={{width:5,height:5,borderRadius:"50%",background:color||"#6b7db3"}}/>{label}</span>;}
function Skeleton({h=16,w="100%",r=8,mb=8}){return<div className="skeleton" style={{height:h,width:w,borderRadius:r,marginBottom:mb}}/>;}
function SkeletonCard(){return<div style={{background:"rgba(255,255,255,0.03)",border:"1px solid rgba(255,255,255,0.07)",borderRadius:14,padding:"16px 18px",marginBottom:10}}><div style={{display:"flex",alignItems:"center",gap:10,marginBottom:12}}><Skeleton h={32} w={32} r={16} mb={0}/><div style={{flex:1}}><Skeleton h={12} w="60%" mb={6}/><Skeleton h={10} w="40%" mb={0}/></div></div><Skeleton h={16} w="85%" mb={8}/><Skeleton h={12} w="100%" mb={4}/><Skeleton h={12} w="70%" mb={10}/><Skeleton h={1} w="100%" mb={10}/><div style={{display:"flex",gap:16}}><Skeleton h={12} w={40} mb={0}/><Skeleton h={12} w={40} mb={0}/><Skeleton h={12} w={40} mb={0}/></div></div>;}
function MetricCard({label,value,unit,color}){return<div style={{padding:"12px 14px",borderRadius:10,background:"rgba(255,255,255,0.03)",border:"1px solid rgba(255,255,255,0.07)",flex:"1 1 140px",minWidth:120}}><div style={{fontSize:10,fontWeight:700,color:color||"#5a6a94",textTransform:"uppercase",letterSpacing:"0.06em",marginBottom:4}}>{label}</div><div style={{fontSize:20,fontWeight:800,color:"#edf1ff"}}>{value}{unit&&<span style={{fontSize:12,fontWeight:600,color:"#6b7db3",marginLeft:2}}>{unit}</span>}</div></div>;}
function GateIndicator({label,passed}){return<div style={{display:"flex",alignItems:"center",gap:6,padding:"4px 0"}}><div style={{width:16,height:16,borderRadius:"50%",background:passed?"rgba(74,222,128,0.15)":"rgba(239,68,68,0.15)",border:"1.5px solid "+(passed?"#4ade80":"#ef4444"),display:"flex",alignItems:"center",justifyContent:"center",fontSize:10,color:passed?"#4ade80":"#ef4444"}}>{passed?"\u2713":"\u2717"}</div><span style={{fontSize:12,color:passed?"#a0d8b0":"#d49a9a"}}>{label}</span></div>;}
function SparkLine({data,height=80,stroke='#5ea8ff'}){if(!data||!data.length)return null;const width=320;const min=Math.min.apply(null,data);const max=Math.max.apply(null,data);const range=(max-min)||1;const pts=data.map(function(v,i){const x=(i/Math.max(1,data.length-1))*width;const y=height-6-((v-min)/range)*(height-12);return x+','+y;}).join(' ');return<svg width="100%" viewBox={'0 0 '+width+' '+height} style={{display:'block'}}><polyline points={pts} fill="none" stroke={stroke} strokeWidth="2" strokeLinejoin="round" strokeLinecap="round"/></svg>;}
function DualSpark({a,b,height=90}){if(!a||!a.length)return null;const width=320;const joined=(a||[]).concat(b||[]);const min=Math.min.apply(null,joined);const max=Math.max.apply(null,joined);const range=(max-min)||1;const mk=function(data){return data.map(function(v,i){const x=(i/Math.max(1,data.length-1))*width;const y=height-6-((v-min)/range)*(height-12);return x+','+y;}).join(' ');};return<svg width="100%" viewBox={'0 0 '+width+' '+height} style={{display:'block'}}><polyline points={mk(a)} fill="none" stroke="#5ea8ff" strokeWidth="2" strokeLinejoin="round" strokeLinecap="round"/><polyline points={mk(b||[])} fill="none" stroke="#a78bfa" strokeWidth="1.5" strokeLinejoin="round" strokeLinecap="round" opacity="0.9"/></svg>;}

function ToolResultView({result,onExport}){
  if(!result)return null;
  if(result.error)return<div style={{color:"#ef4444",fontSize:13}}>{result.error}</div>;
  const d=result.details||{};const cls=result.classification||"";const summary=result.summary||"";
  const engine=d.review_engine||result.review_engine||"";
  const clsColor=cls==="DRIVEN-DISSIPATIVE"||cls==="ADMISSIBLE"||cls==="ELIGIBLE"||cls==="PASS"||cls==="RESILIENT"||cls==="UNIFIED"||cls==="BREAKTHROUGH"?"#4ade80":cls==="AUTONOMOUS CHAOTIC"||cls==="INADMISSIBLE"||cls==="SURGE"||cls==="BLOCK"||cls==="VULNERABLE"||cls==="INCONSISTENT"||cls==="CIRCULAR"?"#ef4444":cls==="BRIDGED"||cls==="CONNECTED"||cls==="MONITORING"||cls==="INTEGRATING"||cls==="DEVELOPING"?"#5ea8ff":cls==="STATIC"||cls==="WANDERING"?"#6b7db3":"#f0a030";
  const isOCM=typeof d.contraction_rate==="number";
  const isER=typeof d.nodes==="number"&&typeof d.edges==="number";
  const isICM=typeof d.events==="number"&&typeof d.morphology==="string";
  const isCLM=typeof d.kappa_w==="number"&&typeof d.glue_error==="number";
  const isNDA=typeof d.stability_score==="number"&&typeof d.regime==="string"&&typeof d.trend==="string";
  const isRCF=typeof d.K_C==="number"&&typeof d.verdict==="string";
  const isETCE=typeof d.collapse_ratio==="number"&&typeof d.dominant==="string";
  const isDesk=d.scores&&typeof d.scores==="object"&&typeof d.scores.scope==="number";
  const trajectory=d.trajectory||result.trajectory||null;
  const handleExport=()=>{if(onExport){const dataStr=JSON.stringify(result,null,2);const blob=new Blob([dataStr],{type:"application/json"});const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download="tool_result.json";a.click();URL.revokeObjectURL(url);}};
  return<div>
    <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:12,flexWrap:"wrap"}}>
      {cls&&<Badge label={cls} color={clsColor}/>}
      {engine&&<span style={{fontSize:9,padding:"2px 8px",borderRadius:10,fontWeight:700,background:engine==="claude"?"rgba(167,139,250,0.15)":"rgba(255,255,255,0.06)",color:engine==="claude"?"#a78bfa":"#5a6a94",border:"1px solid "+(engine==="claude"?"rgba(167,139,250,0.3)":"rgba(255,255,255,0.1)")}}>{engine==="claude"?"Claude AI Review":"Heuristic Review"}</span>}
    </div>
    {summary&&<div style={{fontSize:13,color:"#c7d2f0",lineHeight:1.6,marginBottom:14}}>{summary}</div>}

    {isOCM&&<div>
      <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:12}}><MetricCard label="Contraction Rate" value={d.contraction_rate.toFixed(6)} color="#5ea8ff"/><MetricCard label="Z-Statistic" value={d.z_statistic} color="#a78bfa"/><MetricCard label="Data Points" value={d.points} color="#6b7db3"/></div>
      <div style={{padding:"10px 14px",borderRadius:10,background:"rgba(94,168,255,0.06)",border:"1px solid rgba(94,168,255,0.12)",fontSize:12,color:"#8a9ac4",marginBottom:12}}>Threshold: {d.threshold} | Rate &gt; threshold = driven-dissipative</div>
      {d.z_series&&<div style={{marginBottom:12}}><div style={{fontSize:10,fontWeight:700,color:"#5ea8ff",marginBottom:4}}>Z-SCORE TRACE</div><SparkLine data={d.z_series} stroke="#5ea8ff"/></div>}
      {d.distance_series&&<div style={{marginBottom:12}}><div style={{fontSize:10,fontWeight:700,color:"#a78bfa",marginBottom:4}}>DISTANCE TO BASELINE</div><SparkLine data={d.distance_series} stroke="#a78bfa"/></div>}
      <div style={{padding:"10px 14px",borderRadius:10,background:"rgba(255,255,255,0.02)",border:"1px solid rgba(255,255,255,0.06)",fontSize:11,color:"#6b7db3",lineHeight:1.6}}>
        <strong>Interpretation:</strong> {d.contraction_rate>0.50522?"This series shows driven-dissipative dynamics. The contraction rate exceeds the threshold, indicating the system contracts toward its rolling baseline more often than it diverges. Z="+d.z_statistic+" confirms statistical significance.":"This series does not meet the driven-dissipative threshold. The contraction rate is at or below chance level, suggesting autonomous or stochastic dynamics."}
      </div>
    </div>}

    {isER&&<div>
      <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:12}}><MetricCard label="Nodes" value={d.nodes} color="#a78bfa"/><MetricCard label="Edges" value={d.edges} color="#5ea8ff"/><MetricCard label="Bridges" value={d.bridges} color={d.bridges>0?"#f0a030":"#6b7db3"}/><MetricCard label="Density" value={d.density.toFixed(4)} color="#6b7db3"/></div>
      <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:12}}><MetricCard label="Min Coherence" value={d.min_coherence.toFixed(3)} color="#6b7db3"/><MetricCard label="Mean Coherence" value={d.mean_coherence.toFixed(3)} color="#5ea8ff"/>{d.max_bridge_gap>0&&<MetricCard label="Max Bridge Gap" value={d.max_bridge_gap} color="#f0a030"/>}</div>
      {d.coherence_series&&<div style={{marginBottom:12}}><div style={{fontSize:10,fontWeight:700,color:"#5ea8ff",marginBottom:4}}>ADJACENT COHERENCE</div><SparkLine data={d.coherence_series} stroke="#5ea8ff"/></div>}
      <div style={{padding:"10px 14px",borderRadius:10,background:"rgba(255,255,255,0.02)",border:"1px solid rgba(255,255,255,0.06)",fontSize:11,color:"#6b7db3",lineHeight:1.6}}>
        <strong>Interpretation:</strong> {d.bridges>0?"Long-range bridges detected (gap > 500 points), indicating non-local coherence structure. ":"No long-range bridges. "}{d.density>0.5?"Dense connectivity suggests high global coherence.":d.density>0.1?"Moderate connectivity with localized structure.":"Sparse graph -- the series has limited internal coherence."} Mean coherence = {d.mean_coherence.toFixed(3)}.
      </div>
    </div>}

    {isICM&&<div>
      <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:12}}><MetricCard label="Events" value={d.events} color="#f0a030"/><MetricCard label="Morphology" value={d.morphology} color="#a78bfa"/><MetricCard label="Regime" value={d.regime} color="#5ea8ff"/></div>
      <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:12}}><MetricCard label="Mean Amplitude" value={d.mean_amplitude.toFixed(3)} color="#6b7db3"/><MetricCard label="Mean Recovery" value={d.mean_recovery.toFixed(1)} color="#6b7db3"/><MetricCard label="Resonance R" value={d.resonance_R.toFixed(8)} color="#5ea8ff"/></div>
      <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:12}}><MetricCard label="Amplitude CV" value={d.amp_cv.toFixed(3)} color={d.amp_cv<3?"#4ade80":"#ef4444"}/><MetricCard label="Mean Asymmetry" value={d.mean_asymmetry.toFixed(3)} color="#6b7db3"/></div>
      {d.gates&&<div style={{padding:"10px 14px",borderRadius:10,background:"rgba(255,255,255,0.02)",border:"1px solid rgba(255,255,255,0.06)",marginBottom:12}}><div style={{fontSize:11,fontWeight:700,color:"#5ea8ff",marginBottom:6}}>ADMISSIBILITY GATES</div><GateIndicator label={"A1: Events detected ("+d.events+" found)"} passed={d.gates.A1}/><GateIndicator label={"A2: Regime is weak or resonant ("+d.regime+")"} passed={d.gates.A2}/><GateIndicator label={"A3: Recovery time bounded (mean="+d.mean_recovery.toFixed(1)+")"} passed={d.gates.A3}/><GateIndicator label={"A4: Amplitude CV < 3 (CV="+d.amp_cv.toFixed(3)+")"} passed={d.gates.A4}/></div>}
      <div style={{padding:"10px 14px",borderRadius:10,background:"rgba(255,255,255,0.02)",border:"1px solid rgba(255,255,255,0.06)",fontSize:11,color:"#6b7db3",lineHeight:1.6}}>
        <strong>Interpretation:</strong> {d.events} disruption events with {d.morphology.toLowerCase().replace("_"," ")} morphology. {d.regime==="RESONANT"?"The system is in resonant regime -- forcing and damping are balanced, producing structured recovery patterns.":d.regime==="WEAK"?"Weak regime -- recovery dynamics are present but subtle.":d.regime==="SATURATED"?"Saturated regime -- the system is overwhelmed by forcing.":"Subcritical -- insufficient forcing to produce meaningful disruption events."}
      </div>
    </div>}

    {isCLM&&<div>
      <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:12}}><MetricCard label="Kappa-W" value={d.kappa_w.toFixed(4)} color="#c084fc"/><MetricCard label="Glue Error" value={d.glue_error.toFixed(4)} color="#5ea8ff"/><MetricCard label="Stability" value={d.stability.toFixed(4)} color={d.stability>=0.5?"#4ade80":"#f0a030"}/></div>
      <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:12}}><MetricCard label="P-RMS" value={d.prms.toFixed(4)} color="#6b7db3"/><MetricCard label="Recov. Integral" value={d.ri.toFixed(4)} color="#a78bfa"/>{d.points_used>0&&<MetricCard label="Data Points" value={d.points_used} color="#6b7db3"/>}</div>
      <div style={{padding:"10px 14px",borderRadius:10,background:"rgba(255,255,255,0.02)",border:"1px solid rgba(255,255,255,0.06)",fontSize:11,color:"#6b7db3",lineHeight:1.6}}>

      <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:12}}><MetricCard label="Anomalies" value={d.anomaly_count} color={d.anomaly_count>5?"#ef4444":d.anomaly_count>0?"#f0a030":"#4ade80"}/><MetricCard label="CV" value={d.coefficient_of_variation.toFixed(3)} color="#6b7db3"/><MetricCard label="Roughness" value={d.roughness.toFixed(3)} color="#6b7db3"/></div>
      <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:12}}>{d.seasonal&&<MetricCard label="Season Period" value={d.season_period+" pts"} color="#a78bfa"/>}<MetricCard label="Recovery Time" value={d.mean_recovery_time>0?d.mean_recovery_time.toFixed(1):"N/A"} color="#5ea8ff"/><MetricCard label="Data Points" value={d.data_points} color="#6b7db3"/></div>
      {d.series_preview&&d.series_preview.length>5&&<div style={{marginBottom:12}}><div style={{fontSize:10,fontWeight:700,color:"#22c55e",marginBottom:4}}>TIME SERIES</div><SparkLine data={d.series_preview} stroke="#22c55e"/></div>}
      <div style={{padding:"10px 14px",borderRadius:10,background:"rgba(255,255,255,0.02)",border:"1px solid rgba(255,255,255,0.06)",fontSize:11,color:"#6b7db3",lineHeight:1.6}}>
        <strong>Interpretation:</strong> {d.regime==="STABLE"?"This system shows stable dynamics with low variability and predictable behavior.":d.regime==="CYCLIC"?"Cyclical patterns detected with approximate period of "+d.season_period+" data points. This suggests seasonal or periodic forcing.":d.regime==="CHAOTIC"?"High variability and roughness indicate chaotic or highly irregular dynamics.":d.regime==="TRANSITIONAL"?"The system is undergoing a directional shift ("+d.trend.toLowerCase()+" trend). Monitor for regime change.":" Fluctuating dynamics without clear periodicity or trend."} {d.anomaly_count>0?"Detected "+d.anomaly_count+" anomalous events exceeding 2.5 standard deviations from the rolling mean.":"No significant anomalies detected."} {d.mean_recovery_time>0?"Mean recovery time after disturbance: "+d.mean_recovery_time.toFixed(1)+" time steps.":""}

      <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:12}}><MetricCard label="Stability" value={d.stability_mean.toFixed(3)} color="#5ea8ff"/><MetricCard label="Dispersion" value={d.dispersion.toFixed(3)} color="#6b7db3"/><MetricCard label="Born H" value={d.born_entropy.toFixed(3)} color="#a78bfa"/></div>

      {d.k_series&&d.k_series.length>5&&<div style={{marginBottom:8}}><div style={{fontSize:10,fontWeight:700,color:"#ec4899",marginBottom:4}}>CURVATURE K_C</div><SparkLine data={d.k_series} stroke="#ec4899"/></div>}

    </div>}

    {isETCE&&<div>
      <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:12}}><MetricCard label="Current" value={d.current} color={d.current==="BREAKTHROUGH"?"#4ade80":d.current==="INTEGRATING"?"#5ea8ff":d.current==="CIRCULAR"?"#ef4444":"#f0a030"}/><MetricCard label="Dominant" value={d.dominant} color="#6b7db3"/></div>
      <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:12}}><MetricCard label="Collapse R" value={d.collapse_ratio} color="#14b8a6"/><MetricCard label="Displacement" value={d.displacement} color="#14b8a6"/><MetricCard label="Windows" value={d.n_windows} color="#6b7db3"/></div>
      {d.r_series&&d.r_series.length>3&&<div style={{marginBottom:8}}><div style={{fontSize:10,fontWeight:700,color:"#14b8a6",marginBottom:4}}>COLLAPSE RATIO</div><SparkLine data={d.r_series} stroke="#14b8a6"/></div>}
      {d.d_series&&d.d_series.length>3&&<div style={{marginBottom:8}}><div style={{fontSize:10,fontWeight:700,color:"#a78bfa",marginBottom:4}}>DISPLACEMENT</div><SparkLine data={d.d_series} stroke="#a78bfa"/></div>}
      {d.classification_counts&&<div style={{fontSize:11,color:"#6b7db3",lineHeight:1.6}}>{Object.entries(d.classification_counts).map(function(e){return e[0]+": "+e[1];}).join(" | ")}</div>}
    </div>}

    {trajectory&&<div style={{marginTop:8,padding:"8px 12px",borderRadius:8,background:"rgba(20,184,166,0.06)",border:"1px solid rgba(20,184,166,0.15)",display:"flex",alignItems:"center",gap:8}}><span style={{fontSize:10,fontWeight:700,color:"#14b8a6"}}>TRAJECTORY</span><Badge label={trajectory.trajectory||trajectory.current||"?"} color={trajectory.trajectory==="BREAKTHROUGH"||trajectory.trajectory==="INTEGRATING"?"#4ade80":trajectory.trajectory==="CIRCULAR"?"#ef4444":"#f0a030"}/><span style={{fontSize:10,color:"#6b7db3"}}>R={trajectory.collapse_ratio} D={trajectory.displacement}</span></div>}

    {!isOCM&&!isER&&!isICM&&!isCLM&&!isNDA&&!isRCF&&!isETCE&&!isDesk&&d&&Object.keys(d).length>0&&<pre style={{whiteSpace:"pre-wrap",wordBreak:"break-word",fontSize:12,lineHeight:1.5,color:"#8a9ac4"}}>{typeof d==="string"?d:JSON.stringify(d,null,2)}</pre>}
    {onExport&&<div style={{display:"flex",gap:8,marginTop:12}}><button onClick={handleExport} style={{padding:"6px 12px",borderRadius:8,border:"1px solid rgba(94,168,255,0.3)",background:"rgba(94,168,255,0.08)",color:"#5ea8ff",fontSize:11,fontWeight:700,cursor:"pointer"}}>Export JSON</button><button onClick={()=>{API.post("/api/tools/export",{result:result}).then(res=>{if(typeof res==="string"||res instanceof String){const w=window.open();w.document.write(res);w.document.close();}else{const blob=new Blob([JSON.stringify(res)],{type:"text/html"});window.open(URL.createObjectURL(blob));}}).catch(()=>{const blob=new Blob([JSON.stringify(result,null,2)],{type:"text/html"});window.open(URL.createObjectURL(blob));});}} style={{padding:"6px 12px",borderRadius:8,border:"1px solid rgba(74,222,128,0.3)",background:"rgba(74,222,128,0.08)",color:"#4ade80",fontSize:11,fontWeight:700,cursor:"pointer"}}>Export Report</button></div>}
  </div>;
}
function PaperBody({text}){
  if(!text)return<div style={{fontSize:13,color:"#5a6a94"}}>No full paper text provided.</div>;
  const ref=useRef(null);
  useEffect(()=>{
    if(!ref.current)return;
    var el=ref.current;
    var lines=text.split("\n");
    var html="";
    var kx=typeof katex!=="undefined";
    function tryK(eq,disp){if(!kx)return"<code style='color:#a78bfa;font-size:12px;background:rgba(167,139,250,0.06);padding:1px 4px;border-radius:3px'>"+eq+"</code>";try{return katex.renderToString(eq.trim(),{throwOnError:false,displayMode:!!disp});}catch(e){return"<code style='color:#a78bfa;font-size:12px;background:rgba(167,139,250,0.06);padding:1px 4px;border-radius:3px'>"+eq+"</code>";}}
    function isTbl(l){var t=l.trim();if(!t)return false;if(t.split("\t").length>=2)return true;if(t.indexOf("|")>0&&t.split("|").length>=3)return true;if((t.match(/\s{2,}/g)||[]).length>=2&&t.length>10)return true;return false;}
    function isMathLine(l){var t=l.trim();if(!t||t.length>300)return false;if(t.match(/^\$\$.*\$\$$/)||t.match(/^\$[^$]+\$$/))return true;var mc=(t.match(/[=<>+\-*/^_{}()\\|]/g)||[]).length;if(mc/t.length>0.15&&t.match(/[=<>]/))return true;if(t.match(/^(E\[|P\(|Var|Cov|lim|sup|inf|max|min|arg)/))return true;return false;}
    function doInline(s){s=s.replace(/\$\$([^$]+)\$\$/g,function(m,eq){return tryK(eq,true);});s=s.replace(/\$([^$]+)\$/g,function(m,eq){return tryK(eq,false);});s=s.replace(/(?<![a-zA-Z\\])(alpha|beta|gamma|delta|epsilon|zeta|eta|theta|iota|kappa|lambda|mu|nu|xi|pi|rho|sigma|tau|upsilon|phi|chi|psi|omega|Gamma|Delta|Theta|Lambda|Xi|Pi|Sigma|Phi|Psi|Omega)(?![a-zA-Z])/g,function(m){return tryK("\\"+m,false);});s=s.replace(/([A-Za-z])_\{([^}]+)\}/g,function(m,v,sub){return tryK(v+"_{"+sub+"}",false);});s=s.replace(/([A-Za-z])_([A-Za-z0-9])/g,function(m,v,sub){return tryK(v+"_"+sub,false);});s=s.replace(/([A-Za-z])\^(\{[^}]+\}|\d)/g,function(m,v,sup){return tryK(v+"^"+sup,false);});return s;}
    var i=0;
    while(i<lines.length){
      var line=lines[i];
      if(isTbl(line)){var tl=[];while(i<lines.length&&(isTbl(lines[i])||lines[i].trim().match(/^[-=|+:]+$/))){if(!lines[i].trim().match(/^[-=|+:]+$/))tl.push(lines[i]);i++;}
        if(tl.length>=2){var dlm=tl[0].indexOf("\t")>=0?"\t":tl[0].indexOf("|")>0?"|":null;var rows;if(dlm){rows=tl.map(function(l){return l.split(dlm).map(function(c){return c.trim();}).filter(function(c){return c;});});}else{rows=tl.map(function(l){return l.trim().split(/\s{2,}/).map(function(c){return c.trim();});});}var mc=Math.max.apply(null,rows.map(function(r){return r.length;}));html+="<div style='overflow-x:auto;margin:14px 0;border-radius:8px;border:1px solid rgba(255,255,255,0.08)'><table style='width:100%;border-collapse:collapse;font-size:12px'>";rows.forEach(function(row,ri){html+="<tr>";var tg=ri===0?"th":"td";var bg=ri===0?"rgba(94,168,255,0.08)":ri%2===0?"rgba(255,255,255,0.015)":"transparent";for(var ci=0;ci<mc;ci++){var val=ci<row.length?row[ci].replace(/</g,"&lt;"):"";html+="<"+tg+" style='padding:7px 10px;border-bottom:1px solid rgba(255,255,255,0.06);background:"+bg+";color:"+(ri===0?"#5ea8ff":"#c7d2f0")+";font-weight:"+(ri===0?"700":"400")+"'>"+doInline(val)+"</"+tg+">";}html+="</tr>";});html+="</table></div>";continue;}i-=tl.length;}
      line=lines[i];i++;
      var hMatch=line.match(/^(\d+\.?\d*\.?\s+)(.+)/);
      if(hMatch&&line.length<120&&!line.match(/[=<>]{2}/)&&!isTbl(line)){html+="<h3 style='font-size:15px;font-weight:800;color:#edf1ff;margin:22px 0 8px;padding-bottom:5px;border-bottom:1px solid rgba(255,255,255,0.06)'>"+line.replace(/</g,"&lt;")+"</h3>";continue;}
      var p=line.replace(/</g,"&lt;");
      p=p.replace(/(https?:\/\/\S+\.(png|jpg|jpeg|gif|svg|webp)(\?\S*)?)/gi,function(url){return"<div style='margin:14px 0;text-align:center'><a href='"+url+"' target='_blank' rel='noreferrer'><img src='"+url+"' style='max-width:100%;max-height:400px;border-radius:8px;border:1px solid rgba(255,255,255,0.1)' onerror=\"this.parentElement.innerHTML='<span style=color:#6b7db3;font-size:12px>[Image could not load]</span>'\"/></a></div>";});
      if(isMathLine(line)){var ms=line.trim();if(ms.startsWith("$$")&&ms.endsWith("$$"))ms=ms.slice(2,-2);else if(ms.startsWith("$")&&ms.endsWith("$"))ms=ms.slice(1,-1);html+="<div style='text-align:center;margin:14px 0;padding:12px 16px;background:rgba(94,168,255,0.03);border-radius:8px;border:1px solid rgba(94,168,255,0.08);overflow-x:auto'>"+tryK(ms,true)+"</div>";continue;}
      p=doInline(p);
      if(line.match(/^(Figure|Table|Fig\.)\s+\d/i)){var sp=p.indexOf(":");html+="<div style='font-size:12px;color:#6b7db3;font-style:italic;margin:12px 0;padding:10px 14px;background:rgba(255,255,255,0.02);border-left:3px solid rgba(94,168,255,0.3);border-radius:0 8px 8px 0'><span style='color:#5ea8ff;font-weight:700'>"+(sp>0?p.substring(0,sp+1):"")+"</span>"+(sp>0?p.substring(sp+1):p)+"</div>";continue;}
      if(line.match(/^(Theorem|Proposition|Lemma|Corollary|Proof|Definition|Remark)\b/i)){var dp=p.indexOf(".");html+="<div style='font-size:13px;color:#c7d2f0;margin:12px 0 4px;padding:10px 14px;background:rgba(167,139,250,0.04);border-left:3px solid rgba(167,139,250,0.3);border-radius:0 8px 8px 0'><strong style='color:#a78bfa'>"+(dp>0?p.substring(0,dp+1):p)+"</strong>"+(dp>0?p.substring(dp+1):"")+"</div>";continue;}
      if(line.match(/^\s*[-*]\s+/)){html+="<div style='padding-left:16px;position:relative;min-height:1.2em'><span style='position:absolute;left:4px;color:#5ea8ff'>&#8226;</span>"+p.replace(/^\s*[-*]\s+/,"")+"</div>";continue;}
      p=p.replace(/\[(See\s+)?(Figure|Fig\.?|Table)\s+(\d+[a-z]?)\]/gi,function(m,see,type,num){return"<span style='display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:6px;background:rgba(94,168,255,0.08);border:1px solid rgba(94,168,255,0.15);color:#5ea8ff;font-size:11px;font-weight:700'>"+type+" "+num+"</span>";});
      html+="<div style='min-height:1.2em'>"+p+"</div>";
    }
    el.innerHTML=html;
  },[text]);
  return<div ref={ref} style={{fontSize:13,lineHeight:1.7,color:"#c7d2f0"}}/>;
}
function AuthScreen({onAuth}){

  const submit=()=>{sErr("");sL(true);const url=mode==="login"?"/api/auth/login":"/api/auth/register";const body=mode==="login"?{email:email.trim(),password:pw}:{email:email.trim(),display_name:name.trim(),password:pw};const x=new XMLHttpRequest();x.open("POST",url,true);x.withCredentials=true;x.setRequestHeader("Content-Type","application/json");x.onload=function(){sL(false);let r={};try{r=x.responseText?JSON.parse(x.responseText):{};}catch(e){}if(x.status>=200&&x.status<300&&r.user){_usr=r.user;_usr.initials=_usr.initials||(_usr.display_name||"??").split(" ").map(w=>w[0]).join("").toUpperCase().slice(0,2);_usr.avatar_color=_usr.avatar_color||"#5ea8ff";onAuth(_usr,true);return;}let msg=r.error||("Error ("+x.status+")");if(r.detail)msg+=": "+r.detail;sErr(msg);};x.onerror=function(){sL(false);sErr("Network error");};x.send(JSON.stringify(body));};

lue)} placeholder="Password" type="password" onKeyDown={(e)=>{if(e.key==="Enter")submit();}} style={{width:"100%",padding:"11px 14px",borderRadius:10,border:"1px solid rgba(255,255,255,0.08)",background:"rgba(255,255,255,0.03)",color:"#edf1ff",fontSize:14,boxSizing:"border-box"}}/>{err&&<div style={{fontSize:12,color:"#ef4444",padding:"6px 10px",borderRadius:8,background:"rgba(239,68,68,0.08)"}}>{err}</div>}<button onClick={submit} disabled={loading||!email||!pw||(mode==="register"&&!name)} style={{padding:"12px",borderRadius:10,border:"none",fontSize:14,fontWeight:700,cursor:"pointer",background:"linear-gradient(135deg,#5ea8ff,#3d8be0)",color:"#071120"}}>{loading?"...":(mode==="login"?"Sign In":"Create Account")}</button></div><button onClick={()=>onAuth(_usr,false)} style={{display:"block",width:"100%",marginTop:12,padding:"10px",borderRadius:10,border:"1px solid rgba(255,255,255,0.06)",background:"transparent",color:"#4a5a7e",fontSize:12,fontWeight:600,cursor:"pointer"}}>Continue as guest</button><p style={{fontSize:11,color:"#3a4a6e",textAlign:"center",marginTop:16,lineHeight:1.5}}>No degree required. No institution needed. Just curiosity.</p></div></div>;
