<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#080c18">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="The Journal">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/static/icon-192.png">
<title>The Journal — Independent Physics</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#080c18;color:#edf1ff;font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;-webkit-font-smoothing:antialiased}
#splash{position:fixed;inset:0;background:#080c18;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;transition:opacity .4s}
#splash.hide{opacity:0;pointer-events:none}
#splash .d{width:52px;height:52px;background:linear-gradient(135deg,#5ea8ff,#3d70b8);border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:800;color:#fff;margin-bottom:16px;animation:pulse 2s ease-in-out infinite}
#splash h1{font-size:22px;font-weight:800;letter-spacing:-.02em}
#splash p{font-size:13px;color:#5a6a94;margin-top:4px}
#splash .loading{margin-top:20px;font-size:12px;color:#3a4a6e}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
::placeholder{color:#3a4a6e}
textarea:focus,input:focus,select:focus{outline:none;border-color:rgba(94,168,255,0.4)!important}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.08);border-radius:3px}
</style>
</head>
<body>
<div id="splash"><div class="d">&#x29C7;</div><h1>The Journal</h1><p>Independent Physics</p><div class="loading">Loading app...</div></div>
<div id="root"></div>

<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7/babel.min.js" crossorigin></script>

<script type="text/babel">
const {useState,useEffect,useRef,useCallback} = React;

/* ── DATA ────────────────────────────────────────────────── */
const CATS=[{id:1,slug:"foundations",name:"Foundations of Physics",emoji:"\u{1F30C}"},{id:2,slug:"math-physics",name:"Mathematical Physics",emoji:"\u{1F4D0}"},{id:3,slug:"nonlinear",name:"Nonlinear Dynamics",emoji:"\u{1F300}"},{id:4,slug:"stat-mech",name:"Statistical Mechanics",emoji:"\u269B\uFE0F"},{id:5,slug:"complex",name:"Complex Systems",emoji:"\u{1F578}\uFE0F"},{id:6,slug:"experimental",name:"Experimental & Observational",emoji:"\u{1F52C}"}];
let _usr={id:1,display_name:"Curious Mind",initials:"CM",bio:"Self-taught physicist.",reputation_score:4.2,paper_count:0,review_count:0,follower_count:0,avatar_color:"#5ea8ff",joined:"2026-01-15",role:"member",email:""};
const _users=[_usr];
let _papers=[];
let _published=[];
let _notifs=[];
let _liked=new Set(),_saved=new Set(),_fol=new Set();
const tAgo = (d) => { if(!d) return ""; const m=Math.floor((Date.now()-new Date(d))/6e4); return m<60?m+"m":m<1440?Math.floor(m/60)+"h":Math.floor(m/1440)+"d"; };
const fDate = (d) => d ? new Date(d).toLocaleDateString("en-US",{year:"numeric",month:"short",day:"numeric"}) : "";

/* ── ICONS ─────────────────────────────────────────────── */
function HIcon({d,s=17,f}) { return <svg width={s} height={s} viewBox="0 0 24 24" fill={f?"currentColor":"none"} stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d={d}/></svg>; }
function Av({user,size=36}) { const u=user||_usr; return <div style={{width:size,height:size,borderRadius:"50%",background:"linear-gradient(135deg,"+(u.avatar_color||"#5ea8ff")+","+(u.avatar_color||"#5ea8ff")+"88)",display:"flex",alignItems:"center",justifyContent:"center",color:"#fff",fontWeight:700,fontSize:size*.36,flexShrink:0}}>{u.initials||((u.display_name||"??").slice(0,2).toUpperCase())}</div>; }
function Badge({label,color}) { return <span style={{display:"inline-flex",alignItems:"center",gap:4,padding:"2px 8px",borderRadius:12,fontSize:10,fontWeight:700,background:color+"15",color:color,border:"1px solid "+color+"30"}}><span style={{width:5,height:5,borderRadius:"50%",background:color}}/>{label}</span>; }

/* ── CARD ──────────────────────────────────────────────── */
function Card({paper,onOpen,onProfile,onLike}) {
  const p = paper;
  const [lk,sLk] = useState(!!p.user_liked || _liked.has(p.id));
  const [sv,sSv] = useState(!!p.user_bookmarked || _saved.has(p.id));
  const [lc,sLc] = useState(p.like_count || 0);

  const doLike = (e) => {
    e.stopPropagation();
    if (onLike) {
      onLike(p, function(nextLiked,nextCount){
        sLk(nextLiked);
        if (typeof nextCount === "number") sLc(nextCount);
      });
      return;
    }
    const n=!lk;
    sLk(n);
    sLc(n?lc+1:Math.max(0,lc-1));
  };

  return <div onClick={() => onOpen(p)} style={{background:"rgba(255,255,255,0.03)",border:"1px solid rgba(255,255,255,0.07)",borderRadius:14,padding:"16px 18px",cursor:"pointer",marginBottom:10}}>
    <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:10}}>
      <div onClick={(e) => {e.stopPropagation();onProfile(p.author);}} style={{cursor:"pointer"}}><Av user={p.author} size={32}/></div>
      <div style={{flex:1}}>
        <div style={{display:"flex",alignItems:"center",gap:6,flexWrap:"wrap"}}>
          <span onClick={(e) => {e.stopPropagation();onProfile(p.author);}} style={{fontWeight:600,fontSize:13,cursor:"pointer"}}>{(p.author&&p.author.display_name)||"Anonymous"}</span>
          <span style={{color:"#5a6a94",fontSize:11}}>{tAgo(p.created_at)}</span>
        </div>
        <span style={{fontSize:11,color:"#6b7db3"}}>{p.category&&p.category.emoji} {p.category&&p.category.name}</span>
      </div>
      <Badge label={p.status_label||"Submitted"} color={p.status_color||"#6b7db3"}/>
    </div>
    <h3 style={{fontSize:16,fontWeight:700,lineHeight:1.3,margin:"0 0 6px",color:"#f0f4ff"}}>{p.title}</h3>
    <p style={{fontSize:13,lineHeight:1.5,color:"#8a9ac4",margin:"0 0 10px",overflow:"hidden",display:"-webkit-box",WebkitLineClamp:2,WebkitBoxOrient:"vertical"}}>{p.abstract}</p>
    {p.tags && p.tags.length > 0 && <div style={{display:"flex",gap:4,flexWrap:"wrap",marginBottom:10}}>{p.tags.map((t) => <span key={t} style={{padding:"1px 7px",borderRadius:6,fontSize:10,fontWeight:600,background:"rgba(141,193,255,0.08)",color:"#7da8d4"}}>{t}</span>)}</div>}
    <div style={{display:"flex",alignItems:"center",gap:16,borderTop:"1px solid rgba(255,255,255,0.05)",paddingTop:10}}>
      <button onClick={doLike} style={{display:"flex",alignItems:"center",gap:4,background:"none",border:"none",cursor:"pointer",color:lk?"#ff4d6a":"#5a6a94",fontSize:12,fontWeight:600}}>
        <HIcon d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z" s={15} f={lk}/> {lc}
      </button>
      <span style={{display:"flex",alignItems:"center",gap:4,color:"#5a6a94",fontSize:12,fontWeight:600}}>
        <HIcon d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" s={15}/> {p.comment_count||0}
      </span>
      <span style={{display:"flex",alignItems:"center",gap:4,color:"#5a6a94",fontSize:12,fontWeight:600}}>
        <HIcon d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14l-5-4.87 6.91-1.01L12 2" s={15}/> {p.review_count||0}
      </span>
      <button onClick={(e) => {e.stopPropagation();sSv(!sv);}} style={{display:"flex",alignItems:"center",gap:4,background:"none",border:"none",cursor:"pointer",color:sv?"#f0a030":"#5a6a94",fontSize:12,fontWeight:600,marginLeft:"auto"}}>
        <HIcon d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z" s={15} f={sv}/>
      </button>
    </div>
  </div>;
}

/* ── DETAIL ─────────────────────────────────────────────── */
function Detail({paper,onBack,onProfile,onComment,useApi}) {
  const p = paper;
  const [c,sC] = useState("");
  const [cs,sCs] = useState(p.comments || []);
  const [loading,sLoading] = useState(false);

  useEffect(() => {
    if (!useApi || !p.blind_id) return;
    API.get("/api/submissions/" + p.blind_id).then(function(d){
      if (d && d.submission && d.submission.comments) sCs(d.submission.comments);
    });
  }, [p.blind_id, useApi]);

  const post = () => {
    if (!c.trim()) return;
    if (onComment && useApi && p.blind_id) {
      sLoading(true);
      onComment(p, c.trim()).then(function(d){
        sLoading(false);
        if (d && d.comment) sCs([...cs, d.comment]);
        else sCs([...cs,{id:Date.now(),author:_usr,comment_type:"note",body:c,like_count:0,created_at:new Date().toISOString()}]);
        sC("");
      }).catch(function(){
        sLoading(false);
      });
      return;
    }
    sCs([...cs,{id:Date.now(),author:_usr,comment_type:"note",body:c,like_count:0,created_at:new Date().toISOString()}]);
    sC("");
  };

  return <div style={{maxWidth:640,margin:"0 auto"}}>
    <button onClick={onBack} style={{display:"flex",alignItems:"center",gap:5,background:"none",border:"none",color:"#5ea8ff",cursor:"pointer",fontSize:13,fontWeight:600,marginBottom:10}}>&#8592; Back</button>
    <div style={{background:"rgba(255,255,255,0.03)",border:"1px solid rgba(255,255,255,0.07)",borderRadius:14,padding:20,marginBottom:14}}>
      <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:12}}>
        <div onClick={() => onProfile(p.author)} style={{cursor:"pointer"}}><Av user={p.author} size={40}/></div>
        <div style={{flex:1}}>
          <span onClick={() => onProfile(p.author)} style={{fontWeight:700,fontSize:14,cursor:"pointer"}}>{(p.author&&p.author.display_name)||"Anonymous"}</span>
          <div style={{fontSize:11,color:"#5a6a94"}}>{p.category&&p.category.emoji} {p.category&&p.category.name} &middot; {fDate(p.created_at)}</div>
        </div>
        <Badge label={p.status_label||"Submitted"} color={p.status_color||"#6b7db3"}/>
      </div>
      <h1 style={{fontSize:20,fontWeight:800,lineHeight:1.3,margin:"0 0 10px"}}>{p.title}</h1>
      <div style={{fontSize:10,fontWeight:700,color:"#5ea8ff",textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:6}}>Abstract</div>
      <p style={{fontSize:14,lineHeight:1.6,color:"#a0aed0",margin:0}}>{p.abstract}</p>
    </div>
    <div style={{background:"rgba(255,255,255,0.03)",border:"1px solid rgba(255,255,255,0.07)",borderRadius:14,padding:18}}>
      <h3 style={{fontSize:14,fontWeight:700,margin:"0 0 12px"}}>Discussion ({cs.length})</h3>
      {cs.map((x) => <div key={x.id} style={{display:"flex",gap:10,marginBottom:14,paddingBottom:14,borderBottom:"1px solid rgba(255,255,255,0.04)"}}>
        <Av user={x.author} size={28}/>
        <div style={{flex:1}}>
          <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:3}}>
            <span style={{fontWeight:600,fontSize:12}}>{x.author&&x.author.display_name}</span>
            <span style={{fontSize:10,color:"#4a5a7e"}}>{tAgo(x.created_at)}</span>
            {x.comment_type==="encouragement" && <span style={{fontSize:9,padding:"1px 5px",borderRadius:4,background:"rgba(74,222,128,0.12)",color:"#4ade80",fontWeight:600}}>encouraging</span>}
            {x.comment_type==="question" && <span style={{fontSize:9,padding:"1px 5px",borderRadius:4,background:"rgba(94,168,255,0.12)",color:"#5ea8ff",fontWeight:600}}>question</span>}
          </div>
          <p style={{fontSize:13,lineHeight:1.5,color:"#8a9ac4",margin:0}}>{x.body}</p>
        </div>
      </div>)}
      <div style={{display:"flex",gap:8,alignItems:"flex-end"}}>
        <Av user={_usr} size={28}/>
        <div style={{flex:1,position:"relative"}}>
          <textarea value={c} onChange={(e) => sC(e.target.value)} placeholder="Join the discussion..." onKeyDown={(e) => {if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();post();}}} style={{width:"100%",padding:"9px 40px 9px 12px",borderRadius:10,border:"1px solid rgba(255,255,255,0.08)",background:"rgba(255,255,255,0.03)",color:"#edf1ff",fontSize:13,resize:"none",minHeight:38,fontFamily:"inherit",boxSizing:"border-box"}}/>
          <button onClick={post} style={{position:"absolute",right:6,bottom:6,background:c.trim()?"#5ea8ff":"transparent",border:"none",borderRadius:6,padding:5,cursor:"pointer",color:c.trim()?"#071120":"#3a4a6e"}}>{loading?"…":"▶"}</button>
        </div>
      </div>
    </div>
  </div>;
}

/* ── SUBMIT ─────────────────────────────────────────────── */
function Submit({onBack,onSubmit,useApi}) {
  const [t,sT]=useState("");
  const [a,sA]=useState("");
  const [b,sB]=useState("");
  const [cat,sCat]=useState("");
  const [done,sD]=useState(false);
  const [err,sErr]=useState("");
  const [loading,sLoading]=useState(false);

  const submit = () => {
    if(!(t&&a&&b&&cat)) return;
    sErr("");
    if (onSubmit) {
      sLoading(true);
      Promise.resolve(onSubmit(t,a,b,cat)).then(function(res){
        sLoading(false);
        if (res && res.error) {
          sErr(res.error);
          return;
        }
        sD(true);
      }).catch(function(e){
        sLoading(false);
        sErr((e&&e.message)||"Submission failed");
      });
      return;
    }
    _papers.unshift({id:Date.now(),blind_id:Math.random().toString(36).slice(2,8).toUpperCase(),title:t,abstract:a,status:"in_discovery",status_label:"In Discovery",status_color:"#5ea8ff",category:CATS.find((x)=>x.id==+cat)||CATS[0],author:_usr,tags:[],like_count:0,comment_count:0,review_count:0,created_at:new Date().toISOString(),comments:[]});
    sD(true);
  };

  if (done) return <div style={{maxWidth:480,margin:"0 auto",textAlign:"center",paddingTop:40}}>
    <div style={{width:56,height:56,borderRadius:"50%",background:"rgba(74,222,128,0.12)",display:"flex",alignItems:"center",justifyContent:"center",margin:"0 auto 16px",border:"2px solid rgba(74,222,128,0.3)",color:"#4ade80",fontSize:24}}>&#10003;</div>
    <h2 style={{fontSize:20,fontWeight:800,margin:"0 0 8px"}}>Submitted!</h2>
    <p style={{fontSize:14,color:"#8a9ac4",margin:"0 0 20px"}}>{useApi?"Your work has been submitted to the server.":"Your work is in Discovery."}</p>
    <button onClick={onBack} style={{padding:"10px 24px",borderRadius:10,background:"#5ea8ff",border:"none",color:"#071120",fontWeight:700,fontSize:13,cursor:"pointer"}}>Back</button>
  </div>;

  return <div style={{maxWidth:580,margin:"0 auto"}}>
    <button onClick={onBack} style={{display:"flex",alignItems:"center",gap:5,background:"none",border:"none",color:"#5ea8ff",cursor:"pointer",fontSize:13,fontWeight:600,marginBottom:10}}>&#8592; Back</button>
    <div style={{background:"rgba(255,255,255,0.03)",border:"1px solid rgba(255,255,255,0.07)",borderRadius:14,padding:22}}>
      <h2 style={{fontSize:20,fontWeight:800,margin:"0 0 4px"}}>Share your work</h2>
      <p style={{fontSize:13,color:"#6b7db3",margin:"0 0 16px"}}>No credentials required. If you investigated something, this is the place.</p>
      <div style={{display:"flex",flexDirection:"column",gap:10}}>
        <input value={t} onChange={(e) => sT(e.target.value)} placeholder="Title — what did you investigate?" style={{width:"100%",padding:"10px 12px",borderRadius:10,border:"1px solid rgba(255,255,255,0.08)",background:"rgba(255,255,255,0.03)",color:"#edf1ff",fontSize:14,fontWeight:600,boxSizing:"border-box"}}/>
        <select value={cat} onChange={(e) => sCat(e.target.value)} style={{width:"100%",padding:"10px 12px",borderRadius:10,border:"1px solid rgba(255,255,255,0.08)",background:"rgba(255,255,255,0.03)",color:cat?"#edf1ff":"#3a4a6e",fontSize:12,fontFamily:"inherit",boxSizing:"border-box"}}>
          <option value="">Category</option>
          {CATS.map((x) => <option key={x.id} value={x.id}>{x.emoji} {x.name}</option>)}
        </select>
        <textarea value={a} onChange={(e) => sA(e.target.value)} rows={3} placeholder="Abstract — summarize your main idea" style={{width:"100%",padding:"10px 12px",borderRadius:10,border:"1px solid rgba(255,255,255,0.08)",background:"rgba(255,255,255,0.03)",color:"#edf1ff",fontSize:12,fontFamily:"inherit",resize:"vertical",boxSizing:"border-box"}}/>
        <textarea value={b} onChange={(e) => sB(e.target.value)} rows={8} placeholder="Full paper text" style={{width:"100%",padding:"10px 12px",borderRadius:10,border:"1px solid rgba(255,255,255,0.08)",background:"rgba(255,255,255,0.03)",color:"#edf1ff",fontSize:12,fontFamily:"inherit",resize:"vertical",boxSizing:"border-box"}}/>
        {err && <div style={{fontSize:12,color:"#ef4444",padding:"8px 10px",borderRadius:8,background:"rgba(239,68,68,0.08)"}}>{err}</div>}
        <button onClick={submit} disabled={loading||!t||!a||!b||!cat} style={{padding:"12px",borderRadius:10,border:"none",fontSize:13,fontWeight:700,cursor:t&&a&&b&&cat&&!loading?"pointer":"not-allowed",background:t&&a&&b&&cat&&!loading?"linear-gradient(135deg,#5ea8ff,#3d8be0)":"rgba(255,255,255,0.04)",color:t&&a&&b&&cat&&!loading?"#071120":"#3a4a6e"}}>{loading?"Submitting...":"Submit for review"}</button>
      </div>
    </div>
  </div>;
}

/* ── PROFILE ────────────────────────────────────────────── */
function Profile({user,onBack,onOpen}) {
  const u = user || _usr;
  const [f,sF] = useState(_fol.has(u.id));
  const ps = [..._papers,..._published].filter((p) => p.author && p.author.id===u.id);
  return <div style={{maxWidth:580,margin:"0 auto"}}>
    <button onClick={onBack} style={{display:"flex",alignItems:"center",gap:5,background:"none",border:"none",color:"#5ea8ff",cursor:"pointer",fontSize:13,fontWeight:600,marginBottom:10}}>&#8592; Back</button>
    <div style={{background:"rgba(255,255,255,0.03)",border:"1px solid rgba(255,255,255,0.07)",borderRadius:14,padding:24,textAlign:"center",marginBottom:14}}>
      <div style={{display:"flex",justifyContent:"center"}}><Av user={u} size={64}/></div>
      <h2 style={{fontSize:20,fontWeight:800,margin:"12px 0 4px"}}>{u.display_name}</h2>
      <p style={{fontSize:13,color:"#6b7db3",margin:"0 0 14px"}}>{u.bio}</p>
      <div style={{display:"flex",justifyContent:"center",gap:28,marginBottom:14}}>
        <div><div style={{fontSize:20,fontWeight:800}}>{u.paper_count||0}</div><div style={{fontSize:10,color:"#4a5a7e",fontWeight:600}}>Papers</div></div>
        <div><div style={{fontSize:20,fontWeight:800}}>{u.review_count||0}</div><div style={{fontSize:10,color:"#4a5a7e",fontWeight:600}}>Reviews</div></div>
        <div><div style={{fontSize:20,fontWeight:800,color:"#5ea8ff"}}>{typeof u.reputation_score==="number"?u.reputation_score.toFixed(1):"0.0"}</div><div style={{fontSize:10,color:"#4a5a7e",fontWeight:600}}>Rep</div></div>
      </div>
      <button onClick={() => {const n=!f;sF(n);}} style={{padding:"7px 20px",borderRadius:8,background:f?"rgba(255,255,255,0.03)":"rgba(94,168,255,0.12)",border:"1px solid "+(f?"rgba(255,255,255,0.08)":"rgba(94,168,255,0.25)"),color:f?"#5a6a94":"#5ea8ff",fontWeight:700,fontSize:12,cursor:"pointer"}}>{f?"Following":"Follow"}</button>
    </div>
    {ps.length > 0 && <div>{ps.map((p) => <Card key={p.id} paper={p} onOpen={onOpen} onProfile={() => {}}/>)}</div>}
  </div>;
}

/* ── NOTIFICATIONS ──────────────────────────────────────── */
function Notifs({onBack,items}) {
  const list = items || [];
  return <div style={{maxWidth:580,margin:"0 auto"}}>
    <button onClick={onBack} style={{display:"flex",alignItems:"center",gap:5,background:"none",border:"none",color:"#5ea8ff",cursor:"pointer",fontSize:13,fontWeight:600,marginBottom:10}}>&#8592; Back</button>
    <h2 style={{fontSize:18,fontWeight:800,margin:"0 0 14px"}}>Notifications</h2>
    {list.length===0 && <div style={{padding:"18px 16px",borderRadius:12,background:"rgba(255,255,255,0.02)",border:"1px solid rgba(255,255,255,0.05)",color:"#6b7db3",fontSize:13}}>No notifications yet.</div>}
    {list.map((n) => <div key={n.id} style={{padding:"12px 16px",borderRadius:12,background:n.is_read?"rgba(255,255,255,0.02)":"rgba(94,168,255,0.06)",border:"1px solid "+(n.is_read?"rgba(255,255,255,0.05)":"rgba(94,168,255,0.12)"),marginBottom:8}}>
      <div style={{fontSize:13,fontWeight:600}}>{n.title}</div>
      {n.body && <div style={{fontSize:12,color:"#6b7db3",marginTop:2}}>{n.body}</div>}
      {n.created_at && <div style={{fontSize:10,color:"#4a5a7e",marginTop:4}}>{tAgo(n.created_at)}</div>}
    </div>)}
  </div>;
}

/* ── ADMIN DASHBOARD ────────────────────────────────────── */
function AdminDashboard({onBack}) {
  const [tab,sTab] = useState("submissions");
  const [subs,sSubs] = useState([]);
  const [users,sUsers] = useState([]);
  const [loading,sLoading] = useState(true);
  const [msg,sMsg] = useState("");

  const flash = (text) => {
    sMsg(text);
    setTimeout(() => sMsg(""), 1800);
  };

  const loadSubs = () => {
    sLoading(true);
    API.get("/api/admin/submissions").then(function(d){
      sSubs((d && d.submissions) || []);
      sLoading(false);
    }).catch(function(){ sLoading(false); });
  };

  const loadUsers = () => {
    sLoading(true);
    API.get("/api/admin/users").then(function(d){
      sUsers((d && d.users) || []);
      sLoading(false);
    }).catch(function(){ sLoading(false); });
  };

  useEffect(() => {
    if (tab==="submissions") loadSubs();
    else loadUsers();
  }, [tab]);

  const setStatus = (id,status) => {
    API.post("/api/admin/submissions/" + id + "/status", {status:status}).then(function(d){
      if (d && d.submission) {
        flash("Updated");
        loadSubs();
        return;
      }
      flash((d && d.error) || "Failed");
    }).catch(function(){ flash("Failed"); });
  };

  const deleteSubmission = (id) => {
    if (!confirm("Delete this submission?")) return;
    API.del("/api/admin/submissions/" + id).then(function(d){
      if (d && d.ok) {
        flash("Deleted");
        loadSubs();
        return;
      }
      flash((d && d.error) || "Failed");
    }).catch(function(){ flash("Failed"); });
  };

  const updateRole = (id,role) => {
    API.post("/api/admin/users/" + id + "/role", {role:role}).then(function(d){
      if (d && d.user) {
        flash("Role updated");
        loadUsers();
        return;
      }
      flash((d && d.error) || "Failed");
    }).catch(function(){ flash("Failed"); });
  };

  const banUser = (id,banned) => {
    API.post("/api/admin/users/" + id + (banned?"/unban":"/ban"), {}).then(function(d){
      if (d && d.user) {
        flash(banned?"Unbanned":"Banned");
        loadUsers();
        return;
      }
      flash((d && d.error) || "Failed");
    }).catch(function(){ flash("Failed"); });
  };

  const deleteUser = (id) => {
    if (!confirm("Delete this user?")) return;
    API.del("/api/admin/users/" + id).then(function(d){
      if (d && d.ok) {
        flash("Deleted");
        loadUsers();
        return;
      }
      flash((d && d.error) || "Failed");
    }).catch(function(){ flash("Failed"); });
  };

  const resetDb = () => {
    if (!confirm("Reset the database? This deletes all non-admin users and all submissions.")) return;
    API.post("/api/admin/reset-db", {}).then(function(d){
      if (d && d.ok) {
        flash("Database reset");
        loadSubs();
        loadUsers();
        return;
      }
      flash((d && d.error) || "Failed");
    }).catch(function(){ flash("Failed"); });
  };

  return <div style={{maxWidth:680,margin:"0 auto"}}>
    <button onClick={onBack} style={{display:"flex",alignItems:"center",gap:5,background:"none",border:"none",color:"#5ea8ff",cursor:"pointer",fontSize:13,fontWeight:600,marginBottom:10}}>&#8592; Back</button>
    <h2 style={{fontSize:18,fontWeight:800,margin:"0 0 4px"}}>Admin Dashboard</h2>
    <p style={{fontSize:12,color:"#6b7db3",margin:"0 0 14px"}}>Submissions, users, moderation, and reset controls.</p>

    {msg && <div style={{marginBottom:10,padding:"8px 10px",borderRadius:8,background:"rgba(74,222,128,0.08)",border:"1px solid rgba(74,222,128,0.18)",color:"#4ade80",fontSize:12,fontWeight:700}}>{msg}</div>}

    <div style={{display:"flex",gap:3,padding:3,borderRadius:10,background:"rgba(255,255,255,0.03)",marginBottom:14}}>
      <button onClick={() => sTab("submissions")} style={{flex:1,padding:"8px",borderRadius:8,border:"none",cursor:"pointer",fontSize:12,fontWeight:700,background:tab==="submissions"?"rgba(94,168,255,0.12)":"transparent",color:tab==="submissions"?"#5ea8ff":"#4a5a7e"}}>Submissions</button>
      <button onClick={() => sTab("users")} style={{flex:1,padding:"8px",borderRadius:8,border:"none",cursor:"pointer",fontSize:12,fontWeight:700,background:tab==="users"?"rgba(94,168,255,0.12)":"transparent",color:tab==="users"?"#5ea8ff":"#4a5a7e"}}>Users</button>
    </div>

    {loading && <div style={{textAlign:"center",padding:24,color:"#5ea8ff",fontSize:13}}>Loading...</div>}

    {!loading && tab==="submissions" && <div>
      {subs.length===0 && <div style={{padding:"18px 16px",borderRadius:12,background:"rgba(255,255,255,0.02)",border:"1px solid rgba(255,255,255,0.05)",color:"#6b7db3",fontSize:13}}>No submissions found.</div>}
      {subs.map((p) => <div key={p.id} style={{background:"rgba(255,255,255,0.03)",border:"1px solid rgba(255,255,255,0.07)",borderRadius:16,padding:18,marginBottom:10}}>
        <div style={{display:"flex",justifyContent:"space-between",gap:10,alignItems:"flex-start",marginBottom:8}}>
          <div style={{flex:1}}>
            <div style={{fontSize:18,fontWeight:800,lineHeight:1.25,marginBottom:4}}>{p.title}</div>
            <div style={{fontSize:12,color:"#6b7db3"}}>{(p.author&&p.author.display_name)||"Unknown"} &middot; {tAgo(p.created_at)}</div>
          </div>
          <Badge label={p.status_label||"Submitted"} color={p.status_color||"#6b7db3"}/>
        </div>
        <p style={{fontSize:13,lineHeight:1.55,color:"#8a9ac4",marginBottom:12}}>{p.abstract}</p>
        <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
          <button onClick={() => setStatus(p.id,"published")} style={{padding:"8px 16px",borderRadius:12,border:"none",background:"rgba(74,222,128,0.12)",color:"#4ade80",fontWeight:800,fontSize:12,cursor:"pointer"}}>Publish</button>
          <button onClick={() => setStatus(p.id,"in_discovery")} style={{padding:"8px 16px",borderRadius:12,border:"none",background:"rgba(240,160,48,0.12)",color:"#f0a030",fontWeight:800,fontSize:12,cursor:"pointer"}}>Review</button>
          <button onClick={() => setStatus(p.id,"desk_returned")} style={{padding:"8px 16px",borderRadius:12,border:"none",background:"rgba(94,168,255,0.12)",color:"#5ea8ff",fontWeight:800,fontSize:12,cursor:"pointer"}}>Return</button>
          <button onClick={() => setStatus(p.id,"declined")} style={{padding:"8px 16px",borderRadius:12,border:"none",background:"rgba(239,68,68,0.12)",color:"#ef4444",fontWeight:800,fontSize:12,cursor:"pointer"}}>Decline</button>
          <button onClick={() => deleteSubmission(p.id)} style={{padding:"8px 16px",borderRadius:12,border:"none",background:"rgba(255,255,255,0.08)",color:"#d7def7",fontWeight:800,fontSize:12,cursor:"pointer"}}>Delete</button>
        </div>
      </div>)}
    </div>}

    {!loading && tab==="users" && <div>
      {users.length===0 && <div style={{padding:"18px 16px",borderRadius:12,background:"rgba(255,255,255,0.02)",border:"1px solid rgba(255,255,255,0.05)",color:"#6b7db3",fontSize:13}}>No users found.</div>}
      {users.map((u) => <div key={u.id} style={{background:"rgba(255,255,255,0.03)",border:"1px solid rgba(255,255,255,0.07)",borderRadius:14,padding:14,marginBottom:10}}>
        <div style={{display:"flex",justifyContent:"space-between",gap:10,alignItems:"center"}}>
          <div>
            <div style={{fontSize:14,fontWeight:700}}>{u.display_name}</div>
            <div style={{fontSize:11,color:"#6b7db3"}}>{u.email||""} &middot; {u.role||"member"}{u.is_banned?" &middot; banned":""}</div>
          </div>
          <div style={{display:"flex",gap:6,flexWrap:"wrap",justifyContent:"flex-end"}}>
            <button onClick={() => updateRole(u.id, u.role==="admin"?"member":"admin")} style={{padding:"7px 12px",borderRadius:10,border:"none",background:"rgba(94,168,255,0.12)",color:"#5ea8ff",fontWeight:700,fontSize:11,cursor:"pointer"}}>{u.role==="admin"?"Demote":"Promote"}</button>
            <button onClick={() => banUser(u.id, u.is_banned)} style={{padding:"7px 12px",borderRadius:10,border:"none",background:"rgba(240,160,48,0.12)",color:"#f0a030",fontWeight:700,fontSize:11,cursor:"pointer"}}>{u.is_banned?"Unban":"Ban"}</button>
            <button onClick={() => deleteUser(u.id)} style={{padding:"7px 12px",borderRadius:10,border:"none",background:"rgba(239,68,68,0.12)",color:"#ef4444",fontWeight:700,fontSize:11,cursor:"pointer"}}>Delete</button>
          </div>
        </div>
      </div>)}
      <button onClick={resetDb} style={{width:"100%",padding:"12px",borderRadius:12,border:"1px solid rgba(239,68,68,0.22)",background:"rgba(239,68,68,0.08)",color:"#ef4444",fontWeight:800,fontSize:12,cursor:"pointer",marginTop:8}}>Reset Database (Nuclear Option)</button>
    </div>}
  </div>;
}

else sc.good_faith=wc>=200?5:wc>=100?4:3;if(sc.good_faith>=4)str.push("Sincere inquiry");var vals=Object.keys(sc).map(function(k){return sc[k]});var ov=Math.round(vals.reduce(function(a,b){return a+b},0)/40*100);var rec=sc.good_faith<=1?"block":ov>=60&&sc.good_faith>=3?"pass":"return";return {ov:ov,rec:rec,sc:sc,str:str,sug:sug,fl:fl,sum:rec==="pass"?"Ready for review.":rec==="block"?"Not accepted.":"Needs development.",enc:rec==="block"?"We welcome genuine submissions.":"Your curiosity is valued here."};}

function _ocm(data){var N=data.length,WZ=200,WB=500,E=1e-8;if(N<WB+10) return {err:true};var z=new Array(N).fill(0);for(var t=WZ;t<N;t++){var w=data.slice(t-WZ,t),mu=w.reduce(function(a,b){return a+b},0)/WZ,v=w.reduce(function(a,b){return a+(b-mu)*(b-mu)},0)/WZ;z[t]=(data[t]-mu)/(Math.sqrt(v)+E);}var b2=new Array(N).fill(0);for(var t2=WB;t2<N;t2++)b2[t2]=z.slice(t2-WB,t2).reduce(function(a,v){return a+v},0)/WB;var s=Math.max(WZ,WB),D=data.map(function(_,t){return Math.abs(z[t]-b2[t])}),ind=[];for(var t3=s;t3<N-1;t3++)ind.push(D[t3+1]<D[t3]?1:0);var CR=ind.reduce(function(a,b){return a+b},0)/ind.length,zS=(CR-.5)/Math.sqrt(.25/ind.length);return {CR:+CR.toFixed(6),z:+zS.toFixed(2),cls:CR>.50522?"DRIVEN-DISSIPATIVE":CR<.495?"AUTONOMOUS CHAOTIC":"STOCHASTIC"};}

function _sCLM(st,f,K,N,fg){var psi=st.psi,G=new Array(N).fill(0);for(var n=0;n<N;n++){var s=0;for(var k=0;k<K;k++)s+=psi[k][n];G[n]=s/K;}var nP=Array.from({length:K},function(){return new Array(N)});for(var k2=0;k2<K;k2++)for(var n2=0;n2<N;n2++){var x=psi[k2][n2];var x2=.88*x+.35*(G[n2]-x)+.07*(G[n2]-x)+fg*f[k2][n2];var ax=Math.abs(x);if(ax>1.6)x2+=Math.max(-.25,Math.min(.25,-.14*(ax-1.6)*(x/Math.max(1e-9,ax))));nP[k2][n2]=2.25*Math.tanh(x2/2.25);}var eS=0;for(var k3=0;k3<K;k3++)for(var n3=0;n3<N;n3++)eS+=Math.abs(nP[k3][n3]-G[n3]);var ge=eS/(K*N),df=Math.max(1e-4,.035),kw=Math.max(0,Math.min(10,.75*st.kw+.25*((ge+df)/(Math.max(st.Dp,0)+df))));var stab=Math.max(0,Math.min(1,(1-Math.max(0,kw-1))*(1-ge/.28)));var flat=[];for(var k4=0;k4<K;k4++)for(var n4=0;n4<N;n4++)flat.push(nP[k4][n4]);var prms=Math.sqrt(flat.reduce(function(a,x){return a+x*x},0)/flat.length);return {st:{psi:nP,G:G,kw:kw,Dp:ge,ri:st.ri+Math.max(0,st.Dp-ge)},m:{ge:ge,kw:kw,stab:stab,prms:prms,lbl:kw>1.25?"SURGE":stab>=.5&&ge<.14?"ELIGIBLE":kw<1?"COIL":"DRIFT",ri:st.ri+Math.max(0,st.Dp-ge)},G:G};}

/* Score visuals */
function SB({s,l}) { var p=s/5*100,c=s>=4?"#4ade80":s>=3?"#5ea8ff":s>=2?"#f0a030":"#ef4444"; return <div style={{marginBottom:5}}><div style={{display:"flex",justifyContent:"space-between"}}><span style={{fontSize:10,fontWeight:700,color:"#6b7db3"}}>{l}</span><span style={{fontSize:10,fontWeight:800,color:c}}>{s}/5</span></div><div style={{height:4,borderRadius:2,background:"rgba(255,255,255,0.05)"}}><div style={{height:"100%",borderRadius:2,background:c,width:p+"%",transition:"width .5s"}}/></div></div>; }

/* ── DESK TOOL ──────────────────────────────────────────── */
function DeskTool({onBack}) {
  const [t,sT]=useState(""); const [a,sA]=useState(""); const [b,sB]=useState(""); const [r,sR]=useState(null); const [ld,sL]=useState(false);
  const samples=[{l:"Friction paper",tt:"Why Does My Ball Always Stop?",aa:"I rolled a ball 500 times and found exponential decay.",bb:"Introduction\nBalls stop. I measured it.\n\nMethods\n500 trials on wood, sandpaper, tile. Measured stopping distance in cm.\n\nResults\nWood: 187cm (std 12). Sandpaper: 67cm (std 8). Tile: 245cm.\nFit y=A*e^(-bx), R squared 0.91-0.97.\n\nDiscussion\nExponential decay from constant friction fraction.\n\nConclusion\nFriction causes exponential energy loss.\n\nReferences\n[1] Halliday, Fundamentals of Physics"},{l:"Spam test",tt:"BUY CRYPTO",aa:"Click here. Guaranteed.",bb:"Buy now. Act now. Free money. Click here."}];
  const crit=[{k:"scope",l:"Scope"},{k:"claim",l:"Claims"},{k:"structure",l:"Structure"},{k:"clarity",l:"Clarity"},{k:"quantitative",l:"Quant"},{k:"citations",l:"Literature"},{k:"anonymity",l:"Anonymity"},{k:"good_faith",l:"Good Faith"}];
  return <div style={{maxWidth:600,margin:"0 auto"}}>
    <button onClick={onBack} style={{display:"flex",alignItems:"center",gap:5,background:"none",border:"none",color:"#5ea8ff",cursor:"pointer",fontSize:13,fontWeight:600,marginBottom:10}}>&#8592; Tools</button>
    <h2 style={{fontSize:18,fontWeight:800,margin:"0 0 10px"}}>&#x2726; AI Desk Review</h2>
    <div style={{display:"flex",gap:5,marginBottom:10,flexWrap:"wrap"}}>{samples.map((s,i) => <button key={i} onClick={() => {sT(s.tt);sA(s.aa);sB(s.bb);sR(null);}} style={{padding:"4px 10px",borderRadius:7,fontSize:11,fontWeight:600,background:"rgba(255,255,255,0.03)",border:"1px solid rgba(255,255,255,0.06)",color:"#6b7db3",cursor:"pointer"}}>{s.l}</button>)}</div>
    <div style={{display:"flex",flexDirection:"column",gap:8,marginBottom:12}}>
      <input value={t} onChange={(e) => sT(e.target.value)} placeholder="Title" style={{width:"100%",padding:"9px 12px",borderRadius:9,border:"1px solid rgba(255,255,255,0.07)",background:"rgba(255,255,255,0.02)",color:"#edf1ff",fontSize:13,fontWeight:600,boxSizing:"border-box"}}/>
      <textarea value={a} onChange={(e) => sA(e.target.value)} rows={2} placeholder="Abstract" style={{width:"100%",padding:"9px 12px",borderRadius:9,border:"1px solid rgba(255,255,255,0.07)",background:"rgba(255,255,255,0.02)",color:"#edf1ff",fontSize:12,fontFamily:"inherit",resize:"vertical",boxSizing:"border-box"}}/>
      <textarea value={b} onChange={(e) => sB(e.target.value)} rows={5} placeholder="Paper text" style={{width:"100%",padding:"9px 12px",borderRadius:9,border:"1px solid rgba(255,255,255,0.07)",background:"rgba(255,255,255,0.02)",color:"#edf1ff",fontSize:12,fontFamily:"inherit",resize:"vertical",boxSizing:"border-box"}}/>
      <button onClick={() => {if(!t||!b)return;sL(true);setTimeout(function(){sR(_desk(t,a,b));sL(false);},1200);}} disabled={ld||!t||!b} style={{padding:"11px",borderRadius:9,border:"none",fontSize:13,fontWeight:700,cursor:t&&b?"pointer":"not-allowed",background:t&&b?"linear-gradient(135deg,#38bdf8,#0ea5e9)":"rgba(255,255,255,0.04)",color:t&&b?"#071120":"#3a4a6e"}}>{ld?"Analyzing...":"Run Review"}</button>
    </div>

      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"0 12px",marginBottom:12}}>{crit.map((c) => <SB key={c.k} s={r.sc[c.k]} l={c.l}/>)}</div>
