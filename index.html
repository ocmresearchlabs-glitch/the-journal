<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#080c18">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="The Journal">
  <meta name="description" content="The Journal -- Independent Physics">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/static/icon-192.png">
  <title>The Journal -- Independent Physics</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:#080c18;color:#edf1ff;font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;-webkit-font-smoothing:antialiased}
    #root{min-height:100vh;min-height:100dvh}
    #splash{position:fixed;inset:0;background:#080c18;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;transition:opacity .4s}
    #splash.hide{opacity:0;pointer-events:none}
    #splash .d{width:52px;height:52px;background:linear-gradient(135deg,#5ea8ff,#3d70b8);border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:800;color:#fff;margin-bottom:16px;animation:pulse 2s ease-in-out infinite}
    #splash h1{font-size:22px;font-weight:800;letter-spacing:-.02em}
    #splash p{font-size:13px;color:#5a6a94;margin-top:4px}
    #splash .loading{margin-top:20px;font-size:12px;color:#3a4a6e}
    @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
    @keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
    ::placeholder{color:#3a4a6e}
    textarea:focus,input:focus,select:focus{outline:none;border-color:rgba(94,168,255,0.4)!important}
    ::-webkit-scrollbar{width:5px}
    ::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.08);border-radius:3px}
  </style>
</head>
<body>
  <div id="splash"><div class="d">&#x29C7;</div><h1>The Journal</h1><p>Independent Physics</p><div class="loading">Loading app...</div></div>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7/babel.min.js" crossorigin></script>
  <script type="text/babel">
const {useState,useEffect,useRef,useCallback}=React;
const CATS=[{id:1,slug:"foundations",name:"Foundations of Physics",emoji:"\u{1F30C}"},{id:2,slug:"math-physics",name:"Mathematical Physics",emoji:"\u{1F4D0}"},{id:3,slug:"nonlinear",name:"Nonlinear Dynamics",emoji:"\u{1F300}"},{id:4,slug:"stat-mech",name:"Statistical Mechanics",emoji:"\u269B\uFE0F"},{id:5,slug:"complex",name:"Complex Systems",emoji:"\u{1F578}\uFE0F"},{id:6,slug:"experimental",name:"Experimental & Observational",emoji:"\u{1F52C}"}];
let _usr={id:1,email:"guest",display_name:"Guest",initials:"GU",bio:"",reputation_score:0,paper_count:0,review_count:0,follower_count:0,avatar_color:"#5ea8ff",joined:null,role:"guest"};
const tAgo=(d)=>{if(!d)return"";const m=Math.floor((Date.now()-new Date(d))/6e4);return m<60?m+"m":m<1440?Math.floor(m/60)+"h":Math.floor(m/1440)+"d";};
const fDate=(d)=>{if(!d)return"";return new Date(d).toLocaleDateString("en-US",{year:"numeric",month:"short",day:"numeric"});};
const API={get(url){return new Promise(function(r){const x=new XMLHttpRequest();x.open("GET",url,true);x.withCredentials=true;x.onload=function(){try{r(JSON.parse(x.responseText));}catch(e){r({});}};x.onerror=function(){r({});};x.send();});},post(url,body){return new Promise(function(r){const x=new XMLHttpRequest();x.open("POST",url,true);x.withCredentials=true;x.setRequestHeader("Content-Type","application/json");x.onload=function(){try{r(JSON.parse(x.responseText));}catch(e){r({});}};x.onerror=function(){r({});};x.send(JSON.stringify(body||{}));});},del(url){return new Promise(function(r){const x=new XMLHttpRequest();x.open("DELETE",url,true);x.withCredentials=true;x.onload=function(){try{r(JSON.parse(x.responseText));}catch(e){r({});}};x.onerror=function(){r({});};x.send();});}};
function postForm(url,fd){return new Promise(function(r){const x=new XMLHttpRequest();x.open("POST",url,true);x.withCredentials=true;x.onload=function(){try{r(JSON.parse(x.responseText));}catch(e){r({error:"Parse error"});}};x.onerror=function(){r({error:"Network error"});};x.send(fd);});}
function HIcon({d,s=17,f}){return <svg width={s} height={s} viewBox="0 0 24 24" fill={f?"currentColor":"none"} stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d={d}/></svg>;}
function Av({user,size=36}){const i=user&&user.initials?user.initials:((user&&user.display_name?user.display_name:"??").split(" ").map(x=>x[0]).join("").toUpperCase().slice(0,2)||"??");const c=user&&user.avatar_color?user.avatar_color:"#5ea8ff";return<div style={{width:size,height:size,borderRadius:"50%",background:"linear-gradient(135deg,"+c+","+c+"88)",display:"flex",alignItems:"center",justifyContent:"center",color:"#fff",fontWeight:700,fontSize:size*.36,flexShrink:0}}>{i}</div>;}
function Badge({label,color}){return<span style={{display:"inline-flex",alignItems:"center",gap:4,padding:"2px 8px",borderRadius:12,fontSize:10,fontWeight:700,background:(color||"#6b7db3")+"15",color:color||"#6b7db3",border:"1px solid "+(color||"#6b7db3")+"30"}}><span style={{width:5,height:5,borderRadius:"50%",background:color||"#6b7db3"}}/>{label}</span>;}

function MetricCard({label,value,unit,color}){return<div style={{padding:"12px 14px",borderRadius:10,background:"rgba(255,255,255,0.03)",border:"1px solid rgba(255,255,255,0.07)",flex:"1 1 140px",minWidth:120}}><div style={{fontSize:10,fontWeight:700,color:color||"#5a6a94",textTransform:"uppercase",letterSpacing:"0.06em",marginBottom:4}}>{label}</div><div style={{fontSize:20,fontWeight:800,color:"#edf1ff"}}>{value}{unit&&<span style={{fontSize:12,fontWeight:600,color:"#6b7db3",marginLeft:2}}>{unit}</span>}</div></div>;}
function GateIndicator({label,passed}){return<div style={{display:"flex",alignItems:"center",gap:6,padding:"4px 0"}}><div style={{width:16,height:16,borderRadius:"50%",background:passed?"rgba(74,222,128,0.15)":"rgba(239,68,68,0.15)",border:"1.5px solid "+(passed?"#4ade80":"#ef4444"),display:"flex",alignItems:"center",justifyContent:"center",fontSize:10,color:passed?"#4ade80":"#ef4444"}}>{passed?"\u2713":"\u2717"}</div><span style={{fontSize:12,color:passed?"#a0d8b0":"#d49a9a"}}>{label}</span></div>;}

function ToolResultView({result}){
  if(!result)return null;
  if(result.error)return<div style={{color:"#ef4444",fontSize:13}}>{result.error}</div>;
  const d=result.details||{};const cls=result.classification||"";const summary=result.summary||"";
  const clsColor=cls==="DRIVEN-DISSIPATIVE"||cls==="ADMISSIBLE"||cls==="ELIGIBLE"||cls==="PASS"?"#4ade80":cls==="AUTONOMOUS CHAOTIC"||cls==="INADMISSIBLE"||cls==="SURGE"||cls==="BLOCK"?"#ef4444":cls==="BRIDGED"||cls==="CONNECTED"?"#5ea8ff":"#f0a030";
  const isOCM=typeof d.contraction_rate==="number";
  const isER=typeof d.nodes==="number"&&typeof d.edges==="number";
  const isICM=typeof d.events==="number"&&typeof d.morphology==="string";
  const isCLM=typeof d.kappa_w==="number"&&typeof d.glue_error==="number";
  const isDesk=d.scores&&typeof d.scores==="object"&&typeof d.scores.scope==="number";
  return<div>
    {cls&&<div style={{marginBottom:12}}><Badge label={cls} color={clsColor}/></div>}
    {summary&&<div style={{fontSize:13,color:"#c7d2f0",lineHeight:1.6,marginBottom:14}}>{summary}</div>}
    {isOCM&&<div><div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:12}}><MetricCard label="Contraction Rate" value={d.contraction_rate.toFixed(6)} color="#5ea8ff"/><MetricCard label="Z-Statistic" value={d.z_statistic} color="#a78bfa"/><MetricCard label="Data Points" value={d.points} color="#6b7db3"/></div><div style={{padding:"10px 14px",borderRadius:10,background:"rgba(94,168,255,0.06)",border:"1px solid rgba(94,168,255,0.12)",fontSize:12,color:"#8a9ac4"}}>Threshold: {d.threshold} | Rate &gt; threshold = driven-dissipative</div></div>}
    {isER&&<div><div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:12}}><MetricCard label="Nodes" value={d.nodes} color="#a78bfa"/><MetricCard label="Edges" value={d.edges} color="#5ea8ff"/><MetricCard label="Bridges" value={d.bridges} color={d.bridges>0?"#f0a030":"#6b7db3"}/><MetricCard label="Density" value={d.density.toFixed(4)} color="#6b7db3"/></div><div style={{display:"flex",gap:8,flexWrap:"wrap"}}><MetricCard label="Min Coherence" value={d.min_coherence.toFixed(3)} color="#6b7db3"/><MetricCard label="Mean Coherence" value={d.mean_coherence.toFixed(3)} color="#5ea8ff"/></div></div>}
    {isICM&&<div><div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:12}}><MetricCard label="Events" value={d.events} color="#f0a030"/><MetricCard label="Morphology" value={d.morphology} color="#a78bfa"/><MetricCard label="Regime" value={d.regime} color="#5ea8ff"/></div><div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:12}}><MetricCard label="Mean Amplitude" value={d.mean_amplitude.toFixed(3)} color="#6b7db3"/><MetricCard label="Mean Recovery" value={d.mean_recovery.toFixed(1)} color="#6b7db3"/><MetricCard label="Resonance R" value={d.resonance_R.toFixed(8)} color="#5ea8ff"/></div>{d.gates&&<div style={{padding:"10px 14px",borderRadius:10,background:"rgba(255,255,255,0.02)",border:"1px solid rgba(255,255,255,0.06)"}}><div style={{fontSize:11,fontWeight:700,color:"#5ea8ff",marginBottom:6}}>ADMISSIBILITY GATES</div><GateIndicator label="A1: Events detected" passed={d.gates.A1}/><GateIndicator label="A2: Regime is weak or resonant" passed={d.gates.A2}/><GateIndicator label="A3: Recovery time bounded" passed={d.gates.A3}/><GateIndicator label="A4: Amplitude CV bounded" passed={d.gates.A4}/></div>}</div>}
    {isCLM&&<div><div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:12}}><MetricCard label="Kappa-W" value={d.kappa_w.toFixed(4)} color="#c084fc"/><MetricCard label="Glue Error" value={d.glue_error.toFixed(4)} color="#5ea8ff"/><MetricCard label="Stability" value={d.stability.toFixed(4)} color={d.stability>=0.5?"#4ade80":"#f0a030"}/></div><div style={{display:"flex",gap:8,flexWrap:"wrap"}}><MetricCard label="P-RMS" value={d.prms.toFixed(4)} color="#6b7db3"/><MetricCard label="Recov. Integral" value={d.ri.toFixed(4)} color="#a78bfa"/></div></div>}
    {isDesk&&<div><div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:12}}>{Object.entries(d.scores).map(function(e){return<MetricCard key={e[0]} label={e[0].charAt(0).toUpperCase()+e[0].slice(1)} value={e[1]+"/5"} color={e[1]>=4?"#4ade80":e[1]>=3?"#5ea8ff":e[1]>=2?"#f0a030":"#ef4444"}/>;})}</div>{typeof d.overall_score==="number"&&<div style={{padding:"10px 14px",borderRadius:10,background:"rgba(94,168,255,0.06)",border:"1px solid rgba(94,168,255,0.12)",fontSize:13,color:"#c7d2f0"}}>Overall: <strong>{d.overall_score}%</strong> | Recommendation: <strong>{(d.recommendation||"").toUpperCase()}</strong></div>}{d.encouragement&&<div style={{fontSize:12,color:"#6b7db3",fontStyle:"italic",marginTop:8}}>{d.encouragement}</div>}</div>}
    {!isOCM&&!isER&&!isICM&&!isCLM&&!isDesk&&d&&Object.keys(d).length>0&&<pre style={{whiteSpace:"pre-wrap",wordBreak:"break-word",fontSize:12,lineHeight:1.5,color:"#8a9ac4"}}>{typeof d==="string"?d:JSON.stringify(d,null,2)}</pre>}
  </div>;
}

function ReviewModal({paper,onClose,onSubmitted,useApi}){
  const[signal,sSignal]=useState("promote");const[clarity,sClarity]=useState(3);const[rigor,sRigor]=useState(3);const[novelty,sNovelty]=useState(3);const[literature,sLiterature]=useState(3);const[rationale,sRationale]=useState("");const[fatal,sFatal]=useState(false);const[loading,sLoading]=useState(false);const[err,sErr]=useState("");
  const submit=()=>{if(!useApi||!rationale.trim()){sErr("Please write a rationale.");return;}sLoading(true);sErr("");API.post("/api/submissions/"+paper.blind_id+"/comments",{body:"[REVIEW: "+signal.toUpperCase()+"] Clarity="+clarity+" Rigor="+rigor+" Novelty="+novelty+" Literature="+literature+(fatal?" FATAL_FLAW":"")+"\n\n"+rationale,comment_type:"review"}).then(function(d){sLoading(false);if(d&&d.comment){onSubmitted&&onSubmitted();onClose();}else{sErr(d.error||"Failed");}}).catch(function(){sLoading(false);sErr("Network error");});};
  const ScoreRow=({label,value,onChange})=><div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"6px 0"}}><span style={{fontSize:12,color:"#8a9ac4",fontWeight:600}}>{label}</span><div style={{display:"flex",gap:4}}>{[1,2,3,4,5].map((n)=><button key={n} onClick={()=>onChange(n)} style={{width:28,height:28,borderRadius:6,border:"1px solid "+(value>=n?"rgba(94,168,255,0.4)":"rgba(255,255,255,0.08)"),background:value>=n?"rgba(94,168,255,0.15)":"transparent",color:value>=n?"#5ea8ff":"#3a4a6e",fontSize:11,fontWeight:700,cursor:"pointer"}}>{n}</button>)}</div></div>;
  return<div style={{position:"fixed",inset:0,zIndex:200,background:"rgba(0,0,0,0.7)",display:"flex",alignItems:"center",justifyContent:"center",padding:16}} onClick={onClose}><div onClick={(e)=>e.stopPropagation()} style={{width:"100%",maxWidth:420,maxHeight:"85vh",overflowY:"auto",background:"#0d1225",border:"1px solid rgba(255,255,255,0.1)",borderRadius:16,padding:20}}>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}><h3 style={{fontSize:16,fontWeight:800,margin:0}}>Review Paper</h3><button onClick={onClose} style={{background:"none",border:"none",color:"#5a6a94",fontSize:18,cursor:"pointer"}}>{"\u2715"}</button></div>
    <div style={{fontSize:13,color:"#6b7db3",marginBottom:14}}>{paper.title}</div>
    <div style={{marginBottom:12}}><div style={{fontSize:11,fontWeight:700,color:"#5ea8ff",marginBottom:6}}>SIGNAL</div><div style={{display:"flex",gap:6}}>{["promote","neutral","concern"].map((s)=><button key={s} onClick={()=>sSignal(s)} style={{flex:1,padding:"7px",borderRadius:8,border:"1px solid "+(signal===s?"rgba(94,168,255,0.4)":"rgba(255,255,255,0.08)"),background:signal===s?"rgba(94,168,255,0.12)":"transparent",color:signal===s?"#5ea8ff":"#5a6a94",fontSize:11,fontWeight:700,cursor:"pointer",textTransform:"capitalize"}}>{s}</button>)}</div></div>
    <div style={{marginBottom:12}}><div style={{fontSize:11,fontWeight:700,color:"#5ea8ff",marginBottom:4}}>SCORES</div><ScoreRow label="Clarity" value={clarity} onChange={sClarity}/><ScoreRow label="Rigor" value={rigor} onChange={sRigor}/><ScoreRow label="Novelty" value={novelty} onChange={sNovelty}/><ScoreRow label="Literature" value={literature} onChange={sLiterature}/></div>
    <div style={{marginBottom:12}}><label style={{display:"flex",alignItems:"center",gap:8,fontSize:12,color:fatal?"#ef4444":"#6b7db3",cursor:"pointer"}}><input type="checkbox" checked={fatal} onChange={(e)=>sFatal(e.target.checked)} style={{accentColor:"#ef4444"}}/>Fatal flaw identified</label></div>
    <textarea value={rationale} onChange={(e)=>sRationale(e.target.value)} rows={4} placeholder="Your rationale -- what worked, what needs improvement..." style={{width:"100%",padding:"10px 12px",borderRadius:10,border:"1px solid rgba(255,255,255,0.08)",background:"rgba(255,255,255,0.03)",color:"#edf1ff",fontSize:13,fontFamily:"inherit",resize:"vertical",boxSizing:"border-box",marginBottom:10}}/>
    {err&&<div style={{fontSize:12,color:"#ef4444",marginBottom:8}}>{err}</div>}
    <button onClick={submit} disabled={loading} style={{width:"100%",padding:"12px",borderRadius:10,border:"none",fontSize:13,fontWeight:700,cursor:"pointer",background:"linear-gradient(135deg,#5ea8ff,#3d8be0)",color:"#071120"}}>{loading?"Submitting...":"Submit Review"}</button>
  </div></div>;
}

function Card({paper,onOpen,onProfile,onLike,onReview,useApi}){
  const p=paper;const[lk,sLk]=useState(!!p.user_liked);const[sv,sSv]=useState(!!p.user_bookmarked);const[lc,sLc]=useState(p.like_count||0);
  const likeClick=(e)=>{e.stopPropagation();if(!useApi||!p.blind_id)return;const pL=lk;const pC=lc;sLk(!pL);sLc(pL?Math.max(0,lc-1):lc+1);onLike&&onLike(p,pL,pC,(ok,lV,lcV)=>{if(!ok){sLk(pL);sLc(pC);}else{if(typeof lV==="boolean")sLk(lV);if(typeof lcV==="number")sLc(lcV);}});};
  const reviewClick=(e)=>{e.stopPropagation();if(!useApi||!p.blind_id)return;onReview&&onReview(p);};
  return<div onClick={()=>onOpen(p)} style={{background:"rgba(255,255,255,0.03)",border:"1px solid rgba(255,255,255,0.07)",borderRadius:14,padding:"16px 18px",cursor:"pointer",marginBottom:10}}>
    <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:10}}>
      <div onClick={(e)=>{e.stopPropagation();onProfile(p.author);}} style={{cursor:"pointer"}}><Av user={p.author||{}} size={32}/></div>
      <div style={{flex:1}}><div style={{display:"flex",alignItems:"center",gap:6,flexWrap:"wrap"}}><span onClick={(e)=>{e.stopPropagation();onProfile(p.author);}} style={{fontWeight:600,fontSize:13,cursor:"pointer"}}>{(p.author&&p.author.display_name)||"Anonymous"}</span><span style={{color:"#5a6a94",fontSize:11}}>{tAgo(p.created_at)}</span></div><span style={{fontSize:11,color:"#6b7db3"}}>{p.category&&p.category.emoji?p.category.emoji:"\u{1F4D0}"} {p.category&&p.category.name?p.category.name:"Physics"}</span></div>
      <Badge label={p.status_label||p.status||"Submitted"} color={p.status_color||"#6b7db3"}/>
    </div>
    <h3 style={{fontSize:16,fontWeight:700,lineHeight:1.3,margin:"0 0 6px",color:"#f0f4ff"}}>{p.title}</h3>
    <p style={{fontSize:13,lineHeight:1.5,color:"#8a9ac4",margin:"0 0 10px",overflow:"hidden",display:"-webkit-box",WebkitLineClamp:2,WebkitBoxOrient:"vertical"}}>{p.abstract}</p>
    {p.tags&&p.tags.length>0&&<div style={{display:"flex",gap:4,flexWrap:"wrap",marginBottom:10}}>{p.tags.map((t)=><span key={t} style={{padding:"1px 7px",borderRadius:6,fontSize:10,fontWeight:600,background:"rgba(141,193,255,0.08)",color:"#7da8d4"}}>{t}</span>)}</div>}
    <div style={{display:"flex",alignItems:"center",gap:16,borderTop:"1px solid rgba(255,255,255,0.05)",paddingTop:10}}>
      <button onClick={likeClick} style={{display:"flex",alignItems:"center",gap:4,background:"none",border:"none",cursor:useApi?"pointer":"default",color:lk?"#ff4d6a":"#5a6a94",fontSize:12,fontWeight:600}}><HIcon d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z" s={15} f={lk}/> {lc}</button>
      <span style={{display:"flex",alignItems:"center",gap:4,color:"#5a6a94",fontSize:12,fontWeight:600}}><HIcon d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" s={15}/> {p.comment_count||0}</span>
      <button onClick={reviewClick} style={{display:"flex",alignItems:"center",gap:4,background:"none",border:"none",cursor:useApi?"pointer":"default",color:"#f0a030",fontSize:12,fontWeight:600}}><HIcon d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14l-5-4.87 6.91-1.01L12 2" s={15}/> {p.review_count||0}</button>
      <button onClick={(e)=>{e.stopPropagation();sSv(!sv);}} style={{display:"flex",alignItems:"center",gap:4,background:"none",border:"none",cursor:"pointer",color:sv?"#f0a030":"#5a6a94",fontSize:12,fontWeight:600,marginLeft:"auto"}}><HIcon d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z" s={15} f={sv}/></button>
    </div>
  </div>;
}

function Detail({paper,onBack,onProfile,onRefresh,useApi}){
  const[fp,sFP]=useState(paper);const[c,sC]=useState("");const[posting,sP]=useState(false);
  useEffect(()=>{if(!paper||!paper.blind_id)return;API.get("/api/submissions/"+paper.blind_id).then(function(d){if(d&&d.submission)sFP(d.submission);});},[paper&&paper.blind_id]);
  const p=fp||paper;const comments=p.comments||[];
  const post=()=>{if(!c.trim()||!useApi||!p.blind_id)return;sP(true);API.post("/api/submissions/"+p.blind_id+"/comments",{body:c,comment_type:"note"}).then(function(d){sP(false);if(d&&d.comment){sFP({...p,comments:[...comments,d.comment]});sC("");onRefresh&&onRefresh();}}).catch(function(){sP(false);});};
  return<div style={{maxWidth:640,margin:"0 auto"}}>
    <button onClick={onBack} style={{display:"flex",alignItems:"center",gap:5,background:"none",border:"none",color:"#5ea8ff",cursor:"pointer",fontSize:13,fontWeight:600,marginBottom:10}}>&#8592; Back</button>
    <div style={{background:"rgba(255,255,255,0.03)",border:"1px solid rgba(255,255,255,0.07)",borderRadius:14,padding:20,marginBottom:14}}>

function ToolHub({onBack,onOpen}){
