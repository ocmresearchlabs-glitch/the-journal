<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#080c18">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="The Journal">
  <meta name="description" content="The Journal -- Independent Physics">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/static/icon-192.png">
  <title>The Journal -- Independent Physics</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:#080c18;color:#edf1ff;font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;-webkit-font-smoothing:antialiased}
    #root{min-height:100vh;min-height:100dvh}
    #splash{position:fixed;inset:0;background:#080c18;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;transition:opacity .4s}
    #splash.hide{opacity:0;pointer-events:none}
    #splash .d{width:52px;height:52px;background:linear-gradient(135deg,#5ea8ff,#3d70b8);border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:800;color:#fff;margin-bottom:16px;animation:pulse 2s ease-in-out infinite}
    #splash h1{font-size:22px;font-weight:800;letter-spacing:-.02em}
    #splash p{font-size:13px;color:#5a6a94;margin-top:4px}
    #splash .loading{margin-top:20px;font-size:12px;color:#3a4a6e}
    @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
    @keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
    ::placeholder{color:#3a4a6e}
    textarea:focus,input:focus,select:focus{outline:none;border-color:rgba(94,168,255,0.4)!important}
    ::-webkit-scrollbar{width:5px}
    ::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.08);border-radius:3px}
  </style>
</head>
<body>
  <div id="splash"><div class="d">&#x29C7;</div><h1>The Journal</h1><p>Independent Physics</p><div class="loading">Loading app...</div></div>
  <div id="root"></div>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" crossorigin>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js" crossorigin></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="/static/app.js"></script>
  <script>
    // The actual frontend code is now in static/app.js
    // But we provide a fallback in case the compiled file is missing
    if (typeof window.React === 'undefined') {
      var fallback = document.createElement('div');
      fallback.innerHTML = '<div style="padding:2rem;text-align:center"><h2>The Journal</h2><p>Loading failed. Please refresh.</p></div>';
      document.getElementById('root').appendChild(fallback);
    }
  </script>
</body>
</html>
